# ============================================================================
#  DORAMA DA DEEP WEB — configuracao
# ============================================================================

video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 179.5          # Shorts aceita ate 3 min; avisa se passar
  grain: 7                  # granulado de filme (0 desliga)
  vignette: true
  lead_in: 0.25             # respiro antes da 1a fala de cada cena (s)
  tail: 0.15                # respiro depois da ultima fala (s)
  transition_seconds:
    dissolve: 0.8
    fadeblack: 0.9
    fadewhite: 0.5
    flash: 0.35
    cut: 0.06

# --------------------------------------------------------------------------
# VOZ — ElevenLabs eleven_v3 (o mesmo pool de chaves do ubt-bemnamosca).
# O roteiro dirige a atuacao com marcacoes entre colchetes, que o v3 interpreta
# e NAO fala: [whispers] [excited] [sighs] [laughs softly] [nervous] [sad] ...
# Reserva automatica: edge-tts (campos voice/rate/pitch), se o ElevenLabs falhar.
# --------------------------------------------------------------------------
tts:
  provider: "elevenlabs"        # elevenlabs | edge
  model: "eleven_v3"
  # Cada fala e nivelada em level_lufs (por voz, padrao -18) antes da mixagem.
  # silencio maximo DENTRO de uma fala (o v3 as vezes respira 1s+). 0 = nao mexe
  max_gap: 0.4

# Vozes premade (as unicas liberadas nas chaves gratuitas). Amostras para
# comparar em output/amostras_voz/ — trocar = mudar o voice_id aqui.
#   stability no v3: 0.0 criativo (mais emocao, menos previsivel) | 0.5 natural | 1.0 robusto
#   tempo: acelera/desacelera depois de gerar (1.0 = como a voz falou)
# Imagens das cenas (Gemini). batch = metade do preco; o Google promete ate 24h,
# costuma sair em minutos. O comando espera ate batch_wait_minutes; se nao
# terminar, rode o mesmo comando de novo depois (ele retoma). --now = na hora.
images:
  batch: true
  batch_wait_minutes: 30

voices:
  narrador:                     # Davi adulto contando a historia
    # Liam (escolha do usuario 11/11: Brian puxava sotaque ingles as vezes)
    eleven: {voice_id: "TX3LPaxmHKxFdv7VOQHJ", name: "Liam", lang: "pt", stability: 0.5, similarity: 0.8, style: 0.0}
    level_lufs: -18
    tempo: 1.135                # o v3 narra devagar/dramatico; 1.135 = mais energia e cabe em 3 min
    fx: ""
    voice: "pt-BR-AntonioNeural"   # reserva edge-tts
    rate: "+0%"
    pitch: "-4Hz"
    volume: "+0%"
  pensamento:                   # a voz de dentro da cabeca do Davi adolescente
