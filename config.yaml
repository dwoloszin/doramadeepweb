# Trilhas: cada cena pode trocar com `music:` no episodio.
music:
  volume: 0.16
  duck: true                # abaixa a musica quando alguem fala
  tracks:
    dream: {file: "assets/music/bed_calm_piano.mp3", volume: 1.0, filter: ""}
    # "o funk estourado na caixa de som da esquina": batida abafada, vinda de fora
    real:  {file: "assets/music/bed_modern_pop.mp3", volume: 0.9, filter: "lowpass=f=420,volume=1.6"}
    night: {file: "assets/music/bed_calm_piano.mp3", volume: 0.7, filter: "lowpass=f=1800,aecho=0.8:0.7:120:0.35,atempo=0.85"}
  loudness_lufs: -14

subtitles:
  font: "Poppins SemiBold"          # narracao
  thought_font: "Lora Italic"       # pensamento
  dialogue_font: "Cormorant SemiBold Italic"  # fala de personagem
  size: 80                          # px (em 1920 de altura)
  highlight: "&H0070D7FF"           # palavra falada (dourado) — ASS BGR
  thought_color: "&H00F5D8E6"       # lilas claro
  margin_v: 470                     # acima da interface do Shorts/Reels
  max_chars: 22                     # por linha (2 linhas no maximo)

youtube:
  enabled: true             # liga so depois da aprovacao dos episodios
  account: "doramadadeepweb@gmail.com"
  channel_id: "UCqk0O7ZQcr5kXgrt2-7VHpQ"   # @doramadadeepweb — publish recusa canal diferente
  privacy: "private"        # usado so se schedule estiver vazio
  # SEMPRE agendado (pedido do usuario): proximo horario livre, fuso de Brasilia
