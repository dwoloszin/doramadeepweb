# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s09
    kicker: "CAPÍTULO 14"
    title: "O Trajeto da Coragem"
    hook: "20 km de bicicleta, de noite, até o primeiro emprego."

  - bg: s03
    text: |
      No sonho, o meu primeiro dia era em câmera lenta, com trilha eletrônica e luzes de neon.

      _Crachá no peito, prancheta digital na mão... o jovem prodígio que comandava a operação de uma multinacional._

  - bg: s05
    text: |
      Voltei pra casa feliz da vida. Mas a realidade não esperou nem um segundo: eu tinha que estar no trabalho às **onze da noite** daquele mesmo dia... e não tinha um tostão no bolso.

      _A solução veio na hora: a minha fiel companheira, que nunca tinha me deixado na mão._

  - bg: s07
    text: |
      **— Vai de bicicleta?! Até Guarulhos, de noite, menino?!**

      **— Vou, mãe. É o meu compromisso.**

  - bg: s08
    text: |
      **— Então leva o meu colete da entrega. Caminhoneiro não enxerga ninguém à noite, filho.**

  - bg: s09
    text: |
      **Vinte quilômetros.** Mais de uma hora pedalando no acostamento, com caminhão passando a um palmo do guidão.

      _Frio cortante, a perna queimando... mas a minha cabeça só pensava numa coisa: honrar o meu compromisso._

  - bg: s11
    text: |
      Nos dias de chuva, a roupa do trabalho ia embrulhada num saco plástico dentro da mochila. Eu chegava encharcado — mas chegava.

      A escala era **6x1**: seis dias de trabalho para um só de folga. Décadas depois, isso virou pauta de debate no Congresso.

  - bg: s13
    text: |
      Às dez da noite em ponto eu já estava no vestiário. Pontualidade que eu carrego até hoje.

      **— Primeiro dia, né? Chegou uma hora antes! Aqui a gente chama isso de puxa-saco... brincadeira, bem-vindo!**

  - bg: s14
    text: |
      Ao pisar naquele salão, o meu queixo caiu.

      Guarulhos nunca dorme: Congonhas fecha de madrugada, mas **Cumbica funciona 24 horas**.

      _Aquilo não era só uma lanchonete. Era o meu passaporte pra dentro de uma gigante multinacional._

  - bg: s17
    text: |
      **— Seu uniforme, Davi. Bem-vindo à madrugada de Cumbica.**

      _Uniforme vermelho novinho no corpo... e um brilho nos olhos maior que o aeroporto inteiro._

  - type: end
    bg: s18
    big: "O teste de fogo."
    text: |
      Mas o que me esperava atrás das portas daquela cozinha industrial, na madrugada?

      O ritmo da chapa, a equipe... e o meu primeiro teste de fogo.
    cta: "CONTINUA NO CAPÍTULO 15 · Salve e siga para não perder"

  - type: question
    bg: s09
    kicker: "E VOCÊ?"
    title: "Qual sacrifício você já fez?"
    text: |
      Eu pedalei 20 km de noite pra não perder o primeiro emprego.

      _E você: qual sacrifício já fez por uma oportunidade?_
    cta: "RESPONDA NOS COMENTÁRIOS"

