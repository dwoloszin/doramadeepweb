# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 11"
    title: "A Lâmina Secreta"
    hook: "Toda vida começa com uma corrida."

  - bg: s03
    text: |
      Em **1677**, na Holanda, um comerciante de tecidos chamado **Antonie van Leeuwenhoek** fazia microscópios em casa.

      E foi o primeiro ser humano a ver aquilo que eu estava prestes a ver.

  - bg: s05
    text: |
      De dia, o microscópio saía do quarto: eu estudava a natureza em volta de casa.

      _As formigas me ensinavam determinação e trabalho em equipe._ E a cortadeira nem come a folha: leva pro formigueiro para cultivar um **fungo**. Uma fazenda debaixo da terra.

      _As aranhas, paciência._ Fio por fio, a seda é **mais forte que o aço** do mesmo peso.

      _As abelhas, disciplina._ Meio quilo de mel: uns **dois milhões de flores**.

  - bg: s08
    text: |
      Porta trancada, luminária acesa... e a curiosidade máxima de qualquer adolescente com um microscópio no quarto: conhecer as células do próprio corpo.

  - bg: s09
    text: |
      Os **espermatozoides**: aqueles girininhos dos livros de biologia, ali, vivos, nadando na minha frente.

      Leeuwenhoek chamou de **animálculos** — bichinhos. É a única célula do corpo humano que tem **cauda** e nada sozinha.

  - bg: s10
    text: |
      A **cabeça** guarda o DNA: metade da receita de uma pessoa.

      O **pescoço** é cheio de mitocôndrias, as usinas de energia. E a **cauda** é o motor.

      O corpo de um homem fabrica **milhares por segundo**.

  - bg: s11
    text: |
      E o **óvulo**, que eles procuram, é a maior célula do corpo humano: dá para ver a olho nu, um pontinho.

      Dos milhões que largam na corrida... só um chega.

  - bg: s13
    text: |
      **— Davi? Que silêncio é esse aí dentro, menino? Tá fazendo o quê trancado?**

      **— Estudando, mãe! É... biologia!**

      E não era mentira nenhuma.

  - bg: s15
    text: |
      _Biologia nunca mais foi a mesma pra mim. E aquele universo escondido mantinha a minha esperança acesa._

  - type: end
    bg: s17
    big: "O telefone tocou."
    text: |
      Os meses foram passando, e a carteira de trabalho seguia em branco, no fundo da gaveta.

      Até que, quando eu menos esperava, o telefone fixo da sala finalmente tocou.
    cta: "CONTINUA NO CAPÍTULO 12 · Salve e siga para não perder"

  - type: question
    bg: s11
    kicker: "E VOCÊ?"
    title: "Que aula de biologia te deixou de boca aberta?"
    text: |
      Pra mim, foi uma lâmina de vidro numa noite de porta trancada.

      _E pra você?_
    cta: "RESPONDA NOS COMENTÁRIOS"

