carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 7"
    title: "O Café Derramado, as Flores na Mochila e a Kombi Enguiçada"
    hook: "Tem coisa que a gente não consegue dizer... e cabe num punhado de flores."

  - bg: s03
    text: |
      Seis da manhã. O toque estridente do telefone fixo cortou o silêncio da casa.

      Passos até a sala. Uma conversa baixinha. E eu nem imaginava que aquela ligação ia colocar um prazo de validade no meu sonho.

  - bg: s04
    text: |
      **— Gente, era a mãe de vocês! Ela vem buscar todo mundo no fim de semana. Eu até falei que podiam ficar mais, viu?**

      **— Mas já?! Já no fim de semana?!**

      Saiu antes que eu pudesse segurar.

  - bg: s05
    text: |
      **— Aê, Davi! Eu sei que você ama a gente, cara... mas a gente tem que voltar pra casa!**

      _Ama... ama... ama..._

      A palavra ficou ecoando. Ela tinha data pra ir embora.

  - bg: s07
    text: |
      E então, em câmera lenta, a mão macia e quentinha dela deslizou e repousou sobre a minha.

      **— Davi... você tá bem?**

      _O mundo inteiro parou. O calor da mão dela apagou todo o barulho da mesa._

  - bg: s09
    text: |
      Levei um susto tão grande que puxei a mão de uma vez e derrubei o café inteiro na mesa!

      Os primos morreram de rir. Eu ri junto, vermelho igual a um tomate, limpando a bagunça com o pano de prato. Engoli o resto do café e corri para a escola. Era dia de prova.

  - bg: s10
    text: |
      Na volta, passei por um muro cheio de flores lindas e coloridas. Pensei nela na hora.

      Olhei para os dois lados, colhi as mais bonitas e escondi na mochila como se fossem um tesouro.

      _Se eu não sei falar, as flores vão falar por mim._

  - bg: s11
    text: |
      Lá fora, a criançada no quintal: os meninos jogando bola, as meninas brincando de casinha.

      Na ponta dos pés, entrei no quarto onde eles dormiam e deixei o pequeno buquê na mesinha ao lado da cama.

  - bg: s13
    text: |
      **— Davi! A Kombi do seu pai enguiçou de novo, vai lá ajudar a empurrar!**

      Suando, com o ombro colado na lataria, empurrei com toda a força enquanto meu pai tentava dar o tranco.

      **— Força, Davi! Empurra que ela pega!**

      E o motor finalmente pegou, num ronco alto.

  - bg: s14
    text: |
      Enquanto isso, lá dentro, ela entrou no quarto para pegar uma presilha... e achou as flores.

      Da porta, sem ela perceber, minha mãe balançou a cabeça, sorrindo.

      **— Ai, ai, ai... esse menino puxou o pai. Romântico que só!**

  - bg: s16
    text: |
      Quando me virei, ela estava no portão, com as flores nas mãos.

      **— Nossa, Davi... como você é forte!**

      E, todo suado, morrendo de vergonha, ganhei um beijo bem no rosto.

      **— Obrigada pelas flores, Davi... foram as mais lindas que eu já ganhei.**

  - type: end
    bg: s18
    big: "O gelo foi quebrado."
    text: |
      O prazo estava correndo: no fim de semana, ela voltaria para o interior.

      Será que o garoto tímido e BV vai conseguir ficar com a garota dos olhos verdes antes da despedida?
    cta: "CONTINUA NO CAPÍTULO 8 · Salve e siga para não perder"

  - type: question
    bg: s16
    kicker: "E VOCÊ?"
    title: "Flores ou coragem de falar?"
    text: |
      Ele não conseguia falar. Então deixou as flores na mesinha.

      _O que conquista mais: um gesto assim... ou a coragem de falar na cara?_
    cta: "RESPONDA NOS COMENTÁRIOS"

