  title:
    kicker: "EPISÓDIO 10"
    title: "O Universo num Pingo d'Água"
    subtitle: "os selos do jornal e o microscópio de plástico"
  question:
    kicker: "E VOCÊ?"
    title: "Que hobby segurou a sua esperança?"
    subtitle: "Conta pra gente nos comentários."
    footer: "Continua no Episódio 11"

