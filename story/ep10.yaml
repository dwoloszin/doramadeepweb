publish:
  title: "Ep. 10 — O Universo num Pingo d'Água 🔬 #dorama #ciencia"
  description: |
    Jornais encalhados, selinhos colados um por um... e um microscópio de plástico que virou um portal para outro mundo.

    Episódio 10 da vídeo-novela: quando as portas do mundo adulto pareciam fechadas, o garoto da periferia descobriu um universo inteiro dentro de um pingo d'água — paramécios, amebas, as células de Robert Hooke, o olho da mosca, a asa da borboleta, formigas que cultivam fungo e a seda da aranha, mais forte que o aço.

    💬 E você? Qual foi a coisa mais incrível que você já viu num microscópio? Conta nos comentários!

    ▶ Ouça como audiobook: a história inteira é narrada.
    ▶ Ative as legendas e siga para não perder o Episódio 11.

    📸 Instagram (capítulo para ler no carrossel): https://www.instagram.com/doramadadeepweb/
    🎵 TikTok: https://www.tiktok.com/@doramamagico

    #dorama #kdrama #novela #ciencia #microscopio #biologia #curiosidades #historianarrada #doramasbrasil #shorts
  tags: [dorama, doramas, kdrama, dorama brasileiro, novela, web novela, historia narrada, audiobook, ciencia,
         microscopio, biologia, curiosidades, paramecio, ameba, celulas, robert hooke, formigas, aranha, abelhas,
         periferia de sao paulo, dorama da deep web, shorts]
  instagram_caption: |
    Episódio 10 — O Universo num Pingo d'Água 🔬

    O mundo lá fora não me dava uma oportunidade.
    Então eu criei o meu, da porta pra dentro.

    🧪 Paramécios, amebas, as "células" de Robert Hooke, o olho da mosca, a asa da borboleta...
