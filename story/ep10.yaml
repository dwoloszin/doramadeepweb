carousel:
  - type: cover
    bg: s03
    kicker: "CAPÍTULO 10"
    title: "O Universo num Pingo d'Água"
    hook: "Eu encontrei um universo inteiro dentro de um pingo d'água."

  - bg: s05
    text: |
      As semanas passavam. A saudade da Camila ia dando lugar à rotina pesada das entregas com o meu pai.

      E o telefone fixo da sala continuava mudo. Nenhuma entrevista de emprego.

      _Desistir nunca foi opção. Mas a esperança dava uma desanimada feia._

  - bg: s06
    text: |
      Até que, no meio de uma entrega, eu vi, pendurado na banca de jornal da esquina:

      **Junte os selos do jornal e ganhe um kit de ciências com microscópio!**

  - bg: s08
    text: |
      **— Leva, leva! Esses de ontem encalharam, iam tudo pro lixo mesmo.**

      **— Tá aí, moleque! Pode cortar seus selinhos à vontade!**

      Graças aos contatos do meu pai, os jornais encalhados viraram o meu tesouro.

  - bg: s09
    text: |
      Cortar e colar cada selinho na cartela era como encher uma barrinha de esperança — a mesma que as preocupações da vida esvaziavam durante a semana.

  - bg: s10
    text: |
      Quando colei o último selo e peguei aquele kit nas mãos, a alegria foi indescritível.

      _Era de plástico, simples, humilde. Mas pra mim? Era um portal pra outra dimensão._

      Se o mundo lá fora não me dava uma oportunidade, eu ia criar o meu, da porta pra dentro.

  - bg: s11
    text: |
      Um pingo de água de poça... e lá dentro, um zoológico inteiro nadando.

      Casca de cebola com as células enfileiradas feito tijolinhos. A asa de um inseto desenhada como um vitral.

  - bg: s14
    text: |
      Passei a olhar para os pequenos seres com outros olhos.

      _As formigas me ensinavam determinação e trabalho em equipe. As aranhas, paciência e precisão na madrugada. E as abelhas, disciplina toda santa manhã._

  - bg: s17
    text: |
      E é claro: teve a noite da curiosidade máxima de qualquer adolescente com um microscópio no quarto. Conhecer as células do meu próprio corpo.

      Os espermatozoides — aqueles girininhos dos livros de biologia — ali, vivos, nadando na minha frente.

      Sabia que é a única célula do corpo humano que tem cauda e nada sozinha?

  - type: end
    bg: s20
    big: "O telefone tocou."
    text: |
      Os meses foram passando, entre formigas, aranhas e lentes de plástico. E a carteira de trabalho, ainda em branco, no fundo da gaveta.

      Até que, quando eu menos esperava, o telefone fixo da sala finalmente tocou.
    cta: "CONTINUA NO CAPÍTULO 11 · Salve e siga para não perder"

  - type: question
    bg: s11
    kicker: "E VOCÊ?"
    title: "Que hobby segurou a sua esperança?"
    text: |
      Pra mim, foi um microscópio de plástico conquistado com selinhos de jornal.

      _E pra você: o que te segurou num tempo difícil?_
