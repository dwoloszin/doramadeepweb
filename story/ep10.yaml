# REGRAS DA SERIE (ver README > Regras de roteiro): ABERTURA MAGICA, pergunta final, som imersivo,
# transicao nao e fala, sonho->real = card: shock, personagem em cena FALA, referencia p/ todo
# personagem/lugar/objeto, elenco consistente (figurante diferente; recorrente sempre no cast).
# ============================================================================
#  EPISODIO 10 — adaptado de scenes/scene10.txt  (semanas depois do Ep. 9; fim do ensino medio)
#
#  Estrutura:
#    ABERTURA  O DORAMA: o jovem inventor no laboratorio dourado, microscopio de bronze,
#              galaxias refletidas no olho
#    titulo
#    CHOQUE    card: shock -> buzinas do centro: as entregas, o telefone mudo, a esperanca cansada
#    A BANCA   o anuncio do kit com microscopio -> o jornaleiro (NOVO, fala) -> os jornais encalhados
#    OS SELOS  a "barrinha de esperanca" na cartela -> o kit chega: plastico simples, "um portal"
#    O MUNDO   (PEDIDO DO AUTOR 13/11: enriquecer com ciencia de verdade, dados checados)
#              paramecio e seus cilios -> ameba e os pseudopodes -> cebola + Robert Hooke (1665,
#              "celulas") -> olho composto da mosca -> escamas da asa da borboleta
#    (o trio da natureza — formigas, aranha, abelhas — foi para o Ep. 11 para caber em 3 min)
#    O CIENTISTA o caderno de desenhos: "da porta pra dentro, eu era um cientista"
#    GANCHO    SEM SPOILER: a porta trancada e "uma lamina que eu nunca contei pra ninguem"
#              (a lamina e o telefone que toca ficaram para o Ep. 11 — o ep10 original foi dividido)
#
#  Voz: pensamento grave (override do Ep. 7, thought_mid).
#  Novos: jornaleiro (personagem, voz George), laboratorio_sonho e lamina (lugares),
#  microscopio, cartela_selos, jornais, carteira_trabalho (objetos), davi_sonho.cientista (roupa).
#  Davi NAO usa oculos (o txt fala em "atras dos oculos": ignorado de proposito).
# ============================================================================

id: ep10
number: 10
title: "O Universo num Pingo d'Água"
source: scenes/scene10.txt

voices:
  pensamento:
    eleven: {stability: 0.5}
    tempo: 1.0
    fx: "thought_mid"

days:
  sonho:
    time: "night, a single warm golden lamp"
    wardrobe:
      davi_sonho: cientista
  entregas:
    time: "weekday morning, harsh bright sun between the buildings"
    wardrobe:
      davi: madrugada_trabalho
      pai: trabalho_ceasa
      jornaleiro: banca
  noite:
    time: "night, a small desk lamp in a dark bedroom"
    wardrobe:
      davi: pos_banho
  natureza:
    time: "early morning, soft first sunlight, dew"
    wardrobe: {}

shots:
  - id: s01
    day: sonho
    location: laboratorio_sonho
    cast: [davi_sonho]
    look: dream
    visual: >-
      Enchanted macro detail shot at night, NO face in the frame, only the
      young man's hands (white shirt sleeves rolled up): under the warm golden
      light of an antique brass lamp, his hands delicately adjust the
      gleaming brass knobs of an ornate antique brass microscope with crystal
      lenses on a dark polished wood workbench, a glass slide glowing with a
      tiny blue light; extremely shallow depth of field, floating golden
      dust, glowing flasks blurred behind. Magical, poetic.
    motion: push_in
    transition: fadeblack
    music: none
    sfx:
      - {gen: "Soft mysterious violin and piano melody slowly growing, wonder and genius", line: 0, dur: 12, db: -4}
      - {gen: "Delicate brass mechanism clicking and a glass slide sliding into place", at: 0.3, dur: 2, db: -10}
    lines:
      - {who: narrador, text: "[Brazilian accent] [dreamy] Tem gente que olha pro céu procurando as estrelas... [softly] eu encontrei um universo inteiro dentro de um pingo d'água.", pause: 0.3}
  - id: s02
    card: title
    bg: s11
    duration: 2.2
    transition: fadeblack
    music: dream
    sfx: [whoosh]
  - id: s03
    day: sonho
    location: laboratorio_sonho
    cast: [davi_sonho]
    look: dream
    visual: >-
      Extreme magical close-up at night: the idealized young man brings his
      eye to the brass eyepiece of the antique microscope; a beam of magical
      bluish light rises from the lens and lights his face; his brown eye,
      wide open with deep fascination, reflects swirling galaxies and
      glowing atomic structures sparkling in the pupil. No glasses.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "Twinkling cosmic shimmer with a soft magical swell", line: 0, dur: 6, db: -6}
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [calmly] Na minha cabeça, eu era um grande inventor... [softly] descobrindo mundos invisíveis que o resto da humanidade ignorava.", pause: 0.25}

  - id: s04
    card: shock
    duration: 1.5
    transition: cut
    music: none
    sfx:
      - {gen: "Fast camera zoom out whoosh, then abrupt city traffic noise", at: 0.0, dur: 1.2, db: 0}
      - {gen: "Car horns honking in heavy downtown traffic", at: 0.4, dur: 2, db: -2}
      - {gen: "Short burst of harsh analog TV static noise", at: 0.8, dur: 0.6, db: -4}
      - {gen: "Deep cinematic sub bass impact boom hit, heavy", at: 1.0, dur: 3, db: 0}

  - id: s05
    day: entregas
    location: centro_sp
    cast: [davi, pai]
    props: [kombi]
    look: real
    visual: >-
      Medium wide shot in harsh morning sun on a busy downtown São Paulo
      street: Davi in his grey hoodie carries a heavy wooden crate of
      tomatoes on his shoulder, sweaty and tired, walking past the open old
      white Kombi where his father unloads more crates; hurried crowd and
      buses around.
    motion: pan_right
    transition: cut
    music: real
    lines:
      - {who: narrador, text: "[Brazilian accent] [sighs] Na vida real, a rotina pesada das entregas seguia... [sadly] e o telefone da sala, mudo. Nenhuma entrevista.", pause: 0.2}
  - id: s06
    day: entregas
    location: banca_jornal
    cast: [davi]
    props: [microscopio]
    look: real
    visual: >-
      Close-up at the open green newsstand in bright sun: hanging from a clip
      among the magazines, a colorful cardboard promotional poster showing a
      big picture of a white-and-blue toy microscope and a science kit with
      little test tubes (no readable text); in the foreground, slightly out
      of focus, Davi's face in his grey hoodie, eyes locked on it, wide open.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "A magical curious twinkle chime, like a sudden idea", at: 0.2, dur: 2, db: -6}
    lines:
      - {who: narrador, text: "[Brazilian accent] [excited] Até que eu vi, pendurado na banca: junte os selos do jornal... [amazed] e ganhe um kit de ciências com microscópio!", pause: 0.2}
  - id: s07
    day: entregas
    location: banca_jornal
    cast: [pai, jornaleiro]
    props: [jornais]
    look: real
    visual: >-
      Friendly medium two-shot at the corner newsstand: the old newsagent
      with white hair and a big white mustache hands a thick tied bundle of
      unsold newspapers to Davi's father in his plaid flannel shirt and cap;
      both laughing like old friends.
    motion: push_in
    transition: cut
    lines:
      - {who: jornaleiro, text: "[Brazilian accent] [laughing] Leva, leva! Esses de ontem encalharam, [warmly] iam tudo pro lixo mesmo.", pause: 0.2}
  - id: s08
    day: entregas
    location: centro_sp
    cast: [davi, pai]
    props: [kombi, jornais]
    look: real
    visual: >-
      Medium two-shot next to the open old white Kombi on the downtown
      street: the father, grinning, drops the tied bundle of newspapers into
      Davi's arms; Davi in his grey hoodie hugs the bundle like a treasure,
      eyes shining.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "A heavy bundle of newspapers dropped into arms, paper rustling", at: 0.2, dur: 2, db: -6}
    lines:
      - {who: pai, text: "[Brazilian accent] [playfully] Tá aí, moleque! O jornaleiro deu tudo. [laughing] Pode cortar seus selinhos à vontade!", pause: 0.2}

  - id: s09
    day: noite
    location: quarto_davi
    cast: [davi]
    props: [cartela_selos, jornais]
    look: real
    visual: >-
      Cozy medium close shot at night in Davi's small bedroom lit by the desk
      lamp: Davi in his navy t-shirt, focused, cuts a tiny stamp out of a
      newspaper with small scissors and glues it onto the collector card on
      the desk, almost full; a pile of cut newspapers around him.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "Scissors snipping paper and a glue stick, quiet bedroom at night", line: 0, dur: 6, db: -8}
    lines:
      - {who: narrador, text: "[Brazilian accent] [warmly] Eu não tinha dinheiro pra comprar jornal todo dia... mas os encalhados viraram o meu tesouro.", pause: 0.15}
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [warmly] Cada selinho colado era uma barrinha de esperança enchendo... [softly] a mesma que a vida esvaziava durante a semana.", pause: 0.2}
  - id: s10
    day: noite
    location: quarto_davi
    cast: [davi]
    props: [microscopio]
    look: real
    visual: >-
      Joyful medium shot at night in the small bedroom: Davi in his navy
      t-shirt has just torn open a cardboard box on the bed and lifts the
      simple white-and-blue plastic toy microscope with both hands like a
      precious jewel, a huge ear-to-ear smile, the desk lamp glowing warm.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "Cardboard box being torn open excitedly, then a curious playful discovery melody", at: 0.0, dur: 6, db: -5}
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [amused] Era de plástico, simples, humilde... [proudly] mas pra mim? Era um portal pra outra dimensão.", pause: 0.2}
      - {who: narrador, text: "[warmly] Se o mundo lá fora não me dava uma oportunidade... [firmly] eu ia criar o meu, da porta pra dentro.", pause: 0.2}

  # ---------------------------------------------------------------- O MUNDO EM MINIATURA (ciencia de verdade)
  - id: s11
    day: noite
    location: lamina
    cast: []
    look: real
    visual: >-
      Breathtaking scientific microscope view: inside the round circle of
      light, a single drop of pond water teeming with life, translucent green
      algae, tiny paramecia and a spinning rotifer swimming, glowing jewel
      colors on the bright background, like a beautiful nature documentary
      micrograph. No text, no labels.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "Magical curious rhythmic discovery music with tiny bubbling water sounds", line: 0, dur: 10, db: -6}
    lines:
      - {who: narrador, text: "[Brazilian accent] [amazed] Um pingo de água de poça... e lá dentro, um zoológico inteiro nadando!", pause: 0.15}
      - {who: narrador, text: "[curious] Aquele bichinho em forma de chinelo é o paramécio: nada girando, empurrado por milhares de pelinhos chamados cílios.", pause: 0.2}
  - id: s12
    day: noite
    location: lamina
    cast: []
    look: real
    visual: >-
      Scientific microscope view inside the round circle of light: a translucent
      amoeba with no fixed shape stretching several soft finger-like extensions
      (pseudopods) toward a tiny green algae cell, about to wrap around it, its
      grainy cytoplasm and a dark nucleus visible; soft phase-contrast colors.
      No text, no labels.
    motion: push_in
    transition: dissolve
    lines:
      - {who: narrador, text: "[Brazilian accent] [playfully] E a ameba? Não tem forma nenhuma! [amazed] Anda esticando o próprio corpo, uns pés falsos... e come abraçando a comida inteira.", pause: 0.2}
  - id: s13
    day: noite
    location: lamina
    cast: []
    look: real
    visual: >-
      Scientific microscope view inside the round circle of light: thin onion
      skin cells lined up perfectly like little bricks in a wall, each with a
      tiny dark nucleus, in soft purple and amber stain, crisp and beautiful.
      No text, no labels.
    motion: pan_right
    transition: dissolve
    lines:
      - {who: narrador, text: "[Brazilian accent] [softly] Casca de cebola: as células enfileiradas feito tijolinhos.", pause: 0.15}
      - {who: narrador, text: "[warmly] Em 1665, o inglês Robert Hooke viu caixinhas assim num pedaço de cortiça... [softly] e deu o nome de células: quartinhos.", pause: 0.2}
  - id: s14
    day: noite
    location: lamina
    cast: []
    look: real
    visual: >-
      Scientific microscope view inside the round circle of light: the compound
      eye of a housefly in extreme magnification, a dome made of thousands of
      tiny perfect hexagonal lenses (facets) like a honeycomb, iridescent
      reddish-brown, sharp and astonishing. No text, no labels.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "A soft buzzing fly far away and a magical shimmer", line: 0, dur: 4, db: -10}
    lines:
      - {who: narrador, text: "[Brazilian accent] [amazed] O olho de uma mosca não é um olho só: são milhares de olhinhos grudados, [curious] cada um enxergando um pedacinho do mundo.", pause: 0.2}
  - id: s15
    day: noite
    location: lamina
    cast: []
    look: real
    visual: >-
      Scientific microscope view inside the round circle of light: a butterfly
      wing in extreme magnification, thousands of tiny colorful scales (blue,
      orange, black) overlapping in neat rows exactly like roof tiles,
      shimmering iridescent. No text, no labels.
    motion: pan_right
    transition: dissolve
    lines:
      - {who: narrador, text: "[Brazilian accent] [dreamy] E o pozinho colorido da asa da borboleta? [softly] São escamas minúsculas, encaixadas feito telhas num telhado.", pause: 0.2}
  # ---------------------------------------------------------------- O CIENTISTA DA PORTA PRA DENTRO
  - id: s19
    day: noite
    location: quarto_davi
    cast: [davi]
    props: [microscopio]
    look: real
    visual: >-
      Warm medium close shot at night in the small bedroom lit by the desk
      lamp: Davi in his navy t-shirt, focused and happy, draws careful
      naturalist sketches in a spiral notebook (a cell, an ant, a bee, a fly
      eye made of little hexagons; no readable words), the white-and-blue toy
      microscope beside him, a few glass slides lined up on the desk.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "A pencil sketching on paper, a calm curious melody", line: 0, dur: 8, db: -8}
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [warmly] Eu anotava tudo, desenhava tudo. O mundo lá fora continuava fechado pra mim... [firmly] mas da porta pra dentro, eu era um cientista.", pause: 0.2}
  # ---------------------------------------------------------------- GANCHO (sem spoiler)
  - id: s20
    day: noite
    location: quarto_davi
    cast: [davi]
    props: [microscopio]
    look: real
    visual: >-
      Comic medium close shot at night in the small bedroom lit by the desk
      lamp: Davi in his navy t-shirt sits at the desk with the toy
      microscope, glancing sideways at the closed bedroom door with a
      suspicious, mischievous look, one finger raised as if to say "shh",
      about to place a new glass slide under the lens.
    motion: push_in
    transition: cut
    music: none
    sfx:
      - {gen: "A short comic boing sound and a sudden musical stop", at: 0.0, dur: 1.2, db: -6}
      - {gen: "Playful curious pizzicato strings, light comedy", line: 0, dur: 8, db: -8}
    lines:
      - {who: narrador, text: "[Brazilian accent] [mysterious] Mas teve uma noite... em que a curiosidade falou mais alto que tudo.", pause: 0.15}
      - {who: narrador, text: "[playfully] Porta trancada, luminária acesa... e uma lâmina que eu nunca contei pra ninguém. [suspenseful] O que será que o Davi colocou naquele microscópio?", pause: 0.45}

  - id: s21
    card: question
    bg: s11
    duration: 3.0
    lead: 0.3
    transition: fadeblack
    lines:
      - {who: narrador, text: "[Brazilian accent] [curious] E você? Qual foi a coisa mais incrível que você já viu num microscópio... [playfully] ou que ainda sonha em ver? Conta aqui nos comentários.", pause: 0.4}

# ----------------------------------------------------------------------------
cards:
  title:
    kicker: "EPISÓDIO 10"
    title: "O Universo num Pingo d'Água"
    subtitle: "os selos do jornal e o microscópio de plástico"
  question:
    kicker: "E VOCÊ?"
    title: "O que você já viu num microscópio?"
    subtitle: "Ou o que sonha em ver? Conta nos comentários."
    footer: "Continua no Episódio 11"

