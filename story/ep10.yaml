# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s03
    kicker: "CAPÍTULO 10"
    title: "O Universo num Pingo d'Água"
    hook: "Eu encontrei um universo inteiro dentro de um pingo d'água."

  - bg: s05
    text: |
      As semanas passavam. A rotina pesada das entregas com o meu pai seguia, e o telefone fixo da sala continuava mudo. Nenhuma entrevista de emprego.

      _Desistir nunca foi opção. Mas a esperança dava uma desanimada feia._

  - bg: s06
    text: |
      Até que, no meio de uma entrega, eu vi, pendurado na banca de jornal da esquina:

      **Junte os selos do jornal e ganhe um kit de ciências com microscópio!**

  - bg: s08
    text: |
      **— Leva, leva! Esses de ontem encalharam, iam tudo pro lixo mesmo.**

      **— Tá aí, moleque! Pode cortar seus selinhos à vontade!**

      Cortar e colar cada selinho era como encher uma barrinha de esperança.

  - bg: s10
    text: |
      Quando colei o último selo, a alegria foi indescritível.

      _Era de plástico, simples, humilde. Mas pra mim? Era um portal pra outra dimensão._

  - bg: s11
    text: |
      Um pingo de água de poça... e lá dentro, um zoológico inteiro nadando.

      O paramécio, em forma de chinelo, nada girando, empurrado por milhares de pelinhos chamados **cílios**.

      A ameba não tem forma: anda esticando o próprio corpo — os **pseudópodes**, "pés falsos" — e come abraçando a comida inteira.

  - bg: s13
    text: |
      Na casca de cebola, as células enfileiradas feito tijolinhos.

      Em **1665**, o inglês **Robert Hooke** viu caixinhas assim num pedaço de cortiça e deu a elas o nome de **células** — "quartinhos".

  - bg: s14
    text: |
      O olho de uma mosca não é um olho só: são **milhares de olhinhos** grudados, cada um enxergando um pedacinho do mundo.

      E o pozinho colorido da asa da borboleta são **escamas minúsculas**, encaixadas feito telhas.


  - bg: s19
    text: |
      Eu anotava tudo, desenhava tudo.

      _O mundo lá fora continuava fechado pra mim... mas da porta pra dentro, eu era um cientista._

  - type: end
    bg: s20
    big: "Uma lâmina secreta."
    text: |
      Mas teve uma noite em que a curiosidade falou mais alto que tudo. Porta trancada, luminária acesa... e uma lâmina que eu nunca contei pra ninguém.

      O que será que o Davi colocou naquele microscópio?
    cta: "CONTINUA NO CAPÍTULO 11 · Salve e siga para não perder"

  - type: question
    bg: s11
    kicker: "E VOCÊ?"
    title: "O que você já viu num microscópio?"
    text: |
      Pra mim, um pingo de água de poça virou um universo.

      _E pra você: o que foi mais incrível... ou o que ainda sonha em ver?_
    cta: "RESPONDA NOS COMENTÁRIOS"

