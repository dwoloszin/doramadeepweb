  title:
    kicker: "EPISÓDIO 6"
    title: "O Bilhete na Mesa"
    subtitle: "o Tique-Taque e a Decisão"
  question:
    kicker: "E VOCÊ?"
    title: "Se declarava amanhã... ou esperava?"
    subtitle: "De qualquer jeito, ou no momento certo? Conta nos comentários."
    footer: "Continua no Episódio 7"

