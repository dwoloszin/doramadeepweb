carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 6"
    title: "O Bilhete na Mesa, o Tique-Taque e a Decisão"
    hook: "Tem papel que pesa mais que pedra."

  - bg: s03
    text: |
      O som do papel se desdobrando ecoou na sala vazia. E, na minha cabeça, os violinos começaram a tocar.

      Eu via a Camila parada na porta, as malas prontas, olhando para trás com lágrimas nos olhos verdes.

  - bg: s04
    text: |
      **— Davi... meu coração quase saiu pela boca quando eu te vi pela primeira vez. Fazia anos que ele não batia assim.**

      **— Meu mundo mudou desde que eu pisei nesta casa... e antes de ir embora, eu só queria ouvir a sua voz.**

  - bg: s05
    text: |
      Na minha cabeça, aquele papel era a declaração definitiva de despedida. Um amor impossível que tinha ido embora para sempre enquanto eu estava na escola.

      _Ela foi embora... e eu não falei nada._

  - bg: s07
    text: |
      Mas o filtro dourado sumiu na hora. Era uma folha de caderno arrancada, com uma letra rápida de caneta azul.

      A letra da minha mãe.

      **— Davi, levei seus primos pra fazer compras comigo lá no Brás. Voltamos mais tarde. Seu almoço tá no fogão. Vai no mercadinho e compra pão pro lanche. O dinheiro tá do lado do patinho de cerâmica, na pia.**

  - bg: s08
    text: |
      Que alívio!

      Não era despedida nenhuma. Eles só tinham ido bater perna nas compras do Brás. E eu já tinha enterrado o nosso amor por causa de uma lista de compras.

  - bg: s10
    text: |
      Almocei, lavei a louça, peguei o dinheiro do patinho e fui buscar o pão.

      No caminho, um único pensamento martelava na minha cabeça: eu não podia mais deixar o medo e a timidez me travarem. Aquele susto da casa vazia tinha me acordado.

  - bg: s11
    text: |
      Tentei fazer os deveres da escola, mas o relógio da sala parecia zombar de mim.

      Tic... tac... tic... tac...

      Os minutos pareciam horas. A noite caiu, e eu não tinha escrito uma única linha no caderno.

  - bg: s14
    text: |
      Quando a porta finalmente se abriu, meu coração encheu de alegria. A minha mãe com as sacolas do Brás, os primos se jogando no sofá...

      E, por último, ela. Linda, mesmo depois de um dia inteiro na rua.

      **— Oi, Davi... sentiu falta da gente?**

  - bg: s15
    text: |
      No jantar, eu não conseguia parar de olhar para ela. Até a minha mãe percebeu: arqueou a sobrancelha e segurou um sorriso de canto de boca.

      Eu sabia que aquela noite não era o momento certo. Mas a decisão estava tomada.

  - type: end
    bg: s17
    big: "Amanhã, nada vai me impedir."
    text: |
      Dormi ensaiando cada palavra e cada passo. Mas na vida real, os planos raramente seguem o roteiro que a gente escreve antes de dormir...

      O que esperava por nós quando o sol nascesse?
    cta: "CONTINUA NO CAPÍTULO 7 · Salve e siga para não perder"

  - type: question
    bg: s15
    kicker: "E VOCÊ?"
    title: "Se declarava amanhã... ou esperava?"
    text: |
      O medo passou. A decisão está tomada.

      _No lugar do Davi, você se declarava de qualquer jeito... ou esperava o momento certo?_
    cta: "RESPONDA NOS COMENTÁRIOS"

