carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 8"
    title: "O Universo nos Olhos Verdes"
    hook: "Dizem que o universo inteiro cabe num par de olhos verdes."

  - bg: s03
    text: |
      Na volta da oficina, meu pai me deu dinheiro e um tapinha no ombro.

      **— Toma, filho. Passa na pizzaria e traz três pizzas. Sexta-feira é sexta-feira!**

      Lá em casa, sexta tinha tradição: pizza e filme no nosso vídeo cassete velho.

  - bg: s05
    text: |
      Aliás... você sabe o que é um vídeo cassete?

      Não tinha Netflix, não tinha streaming. Quase nem tinha internet: era conexão discada, de madrugada, e computador custava o preço de um carro.

      A diversão era a fita alugada na locadora e a família reunida na sala.

  - bg: s06
    text: |
      Mal abri o portão e a criançada veio correndo.

      **— Chegou a pizza, gente! Corre, a de calabresa é minha!**

      Levaram as três caixas para dentro, gritando. E o quintal ficou em silêncio.

  - bg: s07
    text: |
      Lá no fundo, debaixo da luz amarela do poste, ela ficou parada. Me olhando.

      Devagar, veio até mim e parou bem na minha frente.

      **— Amanhã a gente vai embora... mas eu fiquei muito feliz de ter passado esses dias aqui. Com você, Davi.**

  - bg: s09
    text: |
      _Eu olhei no fundo daqueles olhos verdes... e vi o universo inteiro brilhando lá dentro._

      _Tudo o que eu lia nos meus livros de ciências ficou pequeno perto daquele olhar._

  - bg: s11
    text: |
      Até que os gritos vieram da janela da sala:

      **— Davi! Camila! Vem logo, senão não vai sobrar nada pra vocês!**

      **— Já estamos indo, pessoal!**

  - bg: s13
    text: |
      Assim que virei o rosto de volta, ela deu um passo à frente, segurou meu rosto... e me beijou.

      Fiquei estátua. Olhos arregalados, vendo ela ali de pertinho. Meus lábios nem mexiam.

      Olha que eu até tinha treinado beijando a própria mão no quarto... mas naquele segundo eu esqueci até quem eu era.

  - bg: s15
    text: |
      Aos poucos fui entendendo o que aquilo significava.

      Envolvi meus braços nela, fechei os olhos e beijei de volta.

      Foi mágico. Finalmente... eu deixava de ser BV. Boca virgem, nunca mais!

  - bg: s16
    text: |
      Cinco minutos lá fora que pareceram horas. Entramos disfarçando e sentamos com todo mundo.

      **— Ué... demoraram, hein? A pizza quase esfriou!**

      Comemos pizza, assistimos ao filme no vídeo cassete. Foi uma noite incrível.

  - bg: s18
    text: |
      Mas quem disse que eu consegui pregar o olho?

      _A única coisa que existia na minha cabeça era o sabor daquele beijo._

  - type: end
    bg: s19
    big: "O sábado chegou rápido demais."
    text: |
      Dormi sorrindo feito bobo. Mas a despedida estava batendo na porta.

      Como seria o adeus no portão... e o que ia sobrar quando a casa voltasse ao silêncio?
    cta: "CONTINUA NO CAPÍTULO 9 · Salve e siga para não perder"

  - type: question
    bg: s15
    kicker: "E VOCÊ?"
    title: "Seu primeiro beijo foi de surpresa?"
    text: |
      Ela me pegou completamente de surpresa. Eu virei estátua.

      _E o seu: foi de surpresa... ou foi você que tomou a iniciativa?_
    cta: "RESPONDA NOS COMENTÁRIOS"

