carousel:
  - type: cover
    bg: s05
    kicker: "CAPÍTULO 9"
    title: "O Adeus na Calçada"
    hook: "No sonho, ela ficava."

  - bg: s04
    text: |
      Acordei com o sol dourado entrando pela janela e o relógio marcando quase dez horas.

      Corri pelo corredor com o coração na boca. A cozinha estava em silêncio... até que uma mão macia tocou o meu ombro.

      **— Bom dia, dorminhoco... vem comigo, eu quero te contar uma coisa.**

  - bg: s05
    text: |
      Ela me levou pela mão até o quintal florido, me abraçou apertado e olhou nos meus olhos.

      **— Eu conversei com a minha mãe, Davi... eu vou ficar mais tempo aqui. Com você.**

      _Ela ia ficar. E o mundo inteiro cabia naquele quintal._

  - bg: s08
    text: |
      **— Davi! Acorda, menino! Já são nove horas! Sua tia chegou pra buscar seus primos, e eles já tão com as malas prontas!**

      Era só um sonho.

      Eu tinha perdido a hora, acordado até tarde lembrando do beijo da noite anterior.

  - bg: s10
    text: |
      Água fria no rosto, cabelo ajeitado com as mãos, e corri para a sala.

      **— Nossa, Davi! Que menino lindo você ficou! Cresceu bastante, hein!**

      **— Obrigado, tia...**

      Mas meus olhos só procuravam uma pessoa. E ela não estava ali.

  - bg: s13
    text: |
      **— Muito obrigada por tudo, viu? Mas a gente tem que correr, senão perde o ônibus na rodoviária!**

      No portão, os primos me cercaram num abraço apertado e barulhento.

      **— Tchau, Davi! Valeu por tudo, primo!**

  - bg: s15
    text: |
      E lá na calçada, ao lado das malas, ela me olhava em silêncio.

      _Naquela troca de olhares à distância, nós dois já sabíamos a verdade: aquela seria a última vez que a gente ia se ver._

  - bg: s17
    text: |
      O horário do ônibus apertou.

      Ela olhou para trás uma última vez... e o último abraço com a Camila nunca aconteceu.

  - bg: s18
    text: |
      A tristeza tomou conta de mim de um jeito que eu nunca tinha sentido.

      Passei o fim de semana trancado no quarto, fingindo estudar para a prova de segunda. Mas no caderno, em vez de fórmulas, só tinha corações. E o nome dela.

  - bg: s19
    text: |
      Foram dias difíceis.

      Mas o tempo não espera ninguém. A tristeza foi dando espaço para a rotina, para as entregas com o meu pai... e eu fui voltando ao normal.

  - type: end
    bg: s20
    big: "Um brilho na esquina."
    text: |
      Semanas depois, no meio do centro de São Paulo, alguma coisa colorida brilhou na vitrine de uma banca de jornal.

      O que será que chamou tanto a atenção daquele garoto?
    cta: "CONTINUA NO CAPÍTULO 10 · Salve e siga para não perder"

  - type: question
    bg: s17
    kicker: "E VOCÊ?"
    title: "Já teve um adeus sem o último abraço?"
    text: |
      Ela foi embora e o último abraço nunca aconteceu.

      _E você? Já viveu uma despedida assim?_
    cta: "RESPONDA NOS COMENTÁRIOS"

