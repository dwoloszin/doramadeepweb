# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 5"
    title: "Ensaios no Espelho, o Quase Beijo e a Casa Vazia"
    hook: "Tem semanas que parecem escritas nas estrelas."

  - bg: s03
    text: |
      As manhãs daquela semana eram as mais lindas da minha vida. O canto dos pássaros, a luz dourada entrando pela janelinha do banheiro.

      Antes mesmo de pisar na cozinha, a minha mente já estava nela.

      _Bom dia, Camila. Sabia que a luz das estrelas que a gente vê viajou milhões de anos só pra chegar aqui?_

  - bg: s04
    text: |
      Na minha cabeça, a gente conversava por horas numa varanda iluminada. Eu falava do universo, das estrelas, da ciência, e de como o nosso mundo parecia pequeno diante de tanta grandeza.

      E ela me ouvia, fascinada, com o queixo apoiado nas mãos.

      **— Fala mais, Davi... eu podia ficar te ouvindo a manhã inteira.**

  - bg: s06
    text: |
      Mas na vida real?

      **— Bom dia, Davi! Dormiu bem?**

      Eu abaixava a cabeça, pegava um pão sem jeito e murmurava um bom dia que nem eu ouvia. Todos os assuntos sobre o universo evaporavam no ar.

  - bg: s07
    text: |
      Com os primos, eu era outra pessoa. Bola na rua, pipa no céu alaranjado, gargalhada até escurecer.

      **— Dá linha, Davi! Dá linha que ela tá subindo!**

      Mas cada esbarrão com a Camila pelos corredores era uma experiência única, que nunca saía como eu planejava.

  - bg: s08
    text: |
      Os dias foram passando, e a convivência foi ficando cada vez mais próxima.

      Até aquela manhã.

      Eu já estava de uniforme, mochila nas costas, quando a gente se cruzou no corredor estreito. O som da casa sumiu. Só o coração: tum-tum... tum-tum...

  - bg: s09
    text: |
      De repente, ela se desequilibrou. Eu a segurei pelos braços, por instinto.

      E ela parou a centímetros do meu rosto. O perfume doce dela tomou conta do ar.

      _Ela tá perto demais, Davi. O que eu faço?_

  - bg: s10
    text: |
      Por uma fração de segundo, os olhos verdes dela desceram até os meus lábios.

      Não foi desequilíbrio nenhum. Foi proposital. Ela queria aquilo.

      **— Ops... desculpa, Davi. Tropecei.**

  - bg: s11
    text: |
      Quase aconteceu um selinho. O meu primeiro.

      O meu primeiro beijo!

      É, pessoal... aos dezesseis anos, eu ainda era BV.

  - bg: s13
    text: |
      Nem lembro como cheguei na escola. O sinal tocava longe, como se eu estivesse debaixo d'água.

      **— Ô Davi, acorda! Tu nem fez as contas de física, que você sempre mata de primeira! Tá estranho, hein, cara!**

      _Ela queria me beijar, Bruno. E agora?_

  - bg: s15
    text: |
      Voltei pra casa ensaiando a coragem que eu não tive de manhã.

      Mas quando abri a porta, não tinha mais ninguém. Nenhuma mala no canto, nenhuma voz no corredor.

      Só o silêncio, um vazio enorme... e um bilhete dobrado em cima da mesa.

  - type: end
    bg: s16
    big: "Um bilhete na mesa."
    text: |
      O que estava escrito ali?

      Será que a minha história com a Camila tinha acabado antes mesmo de começar?
    cta: "CONTINUA NO CAPÍTULO 6 · Salve e siga para não perder"

  - type: question
    bg: s09
    kicker: "E VOCÊ?"
    title: "Quem deve dar o primeiro passo?"
    text: |
      Ela tropeçou de propósito. Ele congelou.

      _Quem deve dar o próximo passo: quem está apaixonado... ou quem provocou?_
    cta: "RESPONDA NOS COMENTÁRIOS"

