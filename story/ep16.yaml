# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 16"
    title: "A Dupla da Noite"
    hook: "Eu dormi como quem flutua... e sonhei que voava entre os aviões."

  - bg: s05
    text: |
      Eu tinha deitado antes do sol nascer. E só acordei com o ronco da velha Kombi do meu pai chegando do trabalho — a mesma que vivia enguiçando.

      _De dentro do banheiro eu já sentia o cheiro do almoço. Nossa, que fome!_

  - bg: s07
    text: |
      **— Mãe, pai, vocês precisam ver! Uns aviões enormes, gente chique indo viajar... e eu trabalho no lugar mais bonito de todo o aeroporto!**

      **— Olha só... o meu filho, no aeroporto internacional!**

      **— Bonito é... mas come direito, que você tá com uma cara de sono!**

      **— Tô ótimo, mãe! Só morrendo de fome!**

  - bg: s09
    text: |
      Depois do almoço, escola. Meus últimos meses de ensino médio... e vinha aí a prova mais temida de todas: o **ENEM**.

      Ele nasceu em **1998**. Pra um garoto da periferia como eu, era a única chance de uma faculdade pública ou de uma bolsa integral numa particular.

  - bg: s11
    text: |
      **— E aí, Davi? Já sabe o que vai prestar?**

      **— Eu? Tô mais perdido que cego em tiroteio!**

      Mas isso... era preocupação pra depois.

  - bg: s12
    text: |
      Jantei, estudei meia horinha...

      _No canto do caderno, ainda tinha os corações daquela semana. Os olhos verdes estavam tão longe..._

  - bg: s13
    text: |
      Um cochilo até as oito, o colete do meu pai... e pé no pedal. Aquele, de verdade, seria o meu primeiro dia de trabalho.

  - bg: s15
    text: |
      **— Cada dupla na sua estação! Thiago, chapa. Davi... balcão, com a Eva.**

      _Ruivinha, sardas no rosto... o meu primeiro dia ao lado dela._

  - type: end
    bg: s16
    big: "A Eva."
    text: |
      **— Você é o novato? Então presta atenção, porque eu não vou repetir.**

      **— S-sim, senhora!**

      **— Senhora não. Eva.**

      Romance à vista? Ah... vocês não fazem ideia.

      E a noite estava só começando.
    cta: "CONTINUA NO CAPÍTULO 17 · Salve e siga para não perder"

  - type: question
    bg: s17
    kicker: "E VOCÊ?"
    title: "Quem te deu medo no primeiro dia?"
    text: |
      Pra mim, foi uma ruivinha de um metro e sessenta.

      _E pra você?_
    cta: "RESPONDA NOS COMENTÁRIOS"

