    Episódio 16 da vídeo-novela: o dia seguinte à primeira noite no aeroporto — a família no almoço, os últimos meses de escola, o ENEM batendo na porta e a primeira noite de trabalho de verdade.

    📚 Você sabia? O ENEM nasceu em 1998. Para muitos jovens da periferia, ele virou a porta de entrada para a faculdade pública ou para uma bolsa integral.

    💬 E você? Já teve alguém que te deu medo logo no primeiro dia? Conta nos comentários!

