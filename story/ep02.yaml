# ----------------------------------------------------------------------------
# CARROSSEL — o capitulo escrito (Instagram 4:5). 1 item = 1 slide.
# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s05
    kicker: "CAPÍTULO 2"
    title: "O Perfume das Frutas e a Madrugada Gelada"
    hook: "O alarme de 1h da manhã escondia um segredo."

  - bg: s03
    text: |
      A névoa da madrugada cobria a cidade como um véu poético.

      Sob a luz amarelada e charmosa dos postes retrô, eu caminhava a passos firmes, compenetrado, cheio de propósito. O vento frio bagunçava meu cabelo do jeito certo. E eu vestia a minha jaqueta favorita.

  - bg: s05
    text: |
      Ao lado de uma imponente perua Volkswagen de colecionador, que parecia ter saído de um filme clássico, eu e meu pai trabalhávamos em perfeita sintonia.

      Mãos ágeis. Olhar atento. Cada fruta escolhida com carinho, buscando a perfeição em cada detalhe.

  - bg: s07
    text: |
      Quem passava pelas ruas ao amanhecer parava para olhar: um rapaz dedicado, que carregava no olhar a promessa de um futuro brilhante e a sensibilidade de quem guarda poesias no peito.

      _O protagonista perfeito. Só faltava a câmera._

  - bg: s09
    text: |
      **Só que a vida real não tinha trilha sonora.**

      Não tinha nada de vintage, charmoso ou poético naquelas madrugadas. O alarme tocava sem nenhuma piedade à 1h da manhã.

  - bg: s10
    text: |
      Eu estava no finalzinho do ensino médio, sem trabalho formal. O meu "estágio" era ajudar meu pai na vida dura de entregador de hortifrúti.

      Enquanto meus colegas dormiam o sono dos justos, nós já estávamos na estrada, rumo ao entreposto no centro de São Paulo.

  - bg: s11
    text: |
      Meu pai estacionava a velha Kombi na rua e alugava um carrinho de madeira, pesado e rangente.

      Eram duas horas cruzando os galpões de um lado para o outro, sob o frio cortante da madrugada.

      _O nariz congelando... e as costas pegando fogo._

  - bg: s13
    text: |
      Comprávamos tudo em caixas fechadas, mas o trabalho pesado começava depois.

      Ali, de pé na calçada, abríamos caixa por caixa. Os tomates eram separados pelo tempo de maturação. As batatas maiores iam para quem fazia fritas; as menores, para outro grupo.

      **Eu participava de absolutamente tudo.**

  - bg: s15
    text: |
      Por volta das 7h, com o sol raiando, devolvíamos o carrinho e saíamos para a maratona de entregas.

      Bar por bar, restaurante por restaurante, desviando da multidão apressada nas calçadas do centro.

  - bg: s16
    text: |
      Quando finalmente voltávamos para casa, perto do meio-dia, o corpo pesava toneladas.

      Eu cheirava a terra e a caixote de madeira. Exausto, mas com o senso de dever cumprido.

  - bg: s17
    text: |
      E ali, no meio daquela rotina pesada, eu olhava para o horizonte com o olhar perdido e me perguntava:

      _É assim que a minha vida vai ser... para sempre?_

  - type: end
    bg: s19
    big: "Vinte folhas de papel."
    text: |
      Uma bicicleta. Quilômetros de estrada.

      Até onde um sonho pode te levar quando você não tem nada a perder?
    cta: "CONTINUA NO CAPÍTULO 3 · Salve e siga para não perder"

