# REGRAS DA SERIE (ver README > Regras de roteiro): pergunta final ao publico,
# som ambiente + efeitos + instrumentos em toda cena, transicao nao e fala.
# ============================================================================
#  EPISODIO 2 — adaptado de scenes/scene2.txt
#
#  Estrutura (retencao):
#    0-6s   COLD OPEN: o alarme de 1h do Ep.1 ganha um segredo
#    titulo
#    SONHO  a madrugada de dorama: nevoa, postes retro, Kombi de colecao, pai e filho
#    CHOQUE card: shock (congela, racha, estilhaca, chiado, a realidade bate na tela)
#    REAL   1h da manha -> entreposto -> separacao na calcada -> entregas -> meio-dia
#    DUVIDA "e assim que a minha vida vai ser pra sempre?"
#    GANCHO 20 folhas, uma bicicleta (sem spoiler) -> PERGUNTA
#
#  Continuidade: e a MESMA madrugada do fim do Ep.1 (alarme 1h).
#    dia "d1"    = vida real (roupa de trabalho)
#    dia "sonho" = a versao dorama da mesma madrugada (roupas do sonho)
# ============================================================================

id: ep02
number: 2
title: "O Perfume das Frutas e a Madrugada Gelada"
source: scenes/scene2.txt

days:
  d1:
    time: "1 AM to noon, a cold winter weekday in São Paulo"
    wardrobe:
      davi: madrugada_trabalho
      pai: trabalho_ceasa
  sonho:
    time: "misty blue dawn"
    wardrobe:
      davi_sonho: jaqueta_favorita
      pai: sonho_madrugada

shots:
  # ---------------------------------------------------------------- COLD OPEN
  - id: s01
    day: d1
    location: quarto_davi
    cast: [davi]
    look: night
    time: "1 AM, deep night"
    ambience: "Very quiet small bedroom at 1 AM, cold night wind against a small window, crickets, a dog barking very far away, deep silence"
    visual: >-
      Extreme close-up in a dark bedroom: a cheap digital alarm clock glowing
      bright red showing 1:00 on a wooden desk, and Davi's bare chubby hand
      with a black digital wristwatch reaching in to slap it off, cold blue
      moonlight, red glow on his fingers.
    motion: push_in
    transition: fadeblack
    music: none
    sfx: [{name: alarm, line: 0}]
    lines:
      - {who: narrador, text: "[Brazilian accent] [mysterious] Lembra daquele alarme de uma da manhã?", pause: 0.3}
      - {who: narrador, text: "[Brazilian accent] [whispers] Ele tocava toda semana. [dramatic] E escondia um segredo que nenhum colega meu sabia.", pause: 0.15}

  - id: s02
    card: title
    bg: s03
    duration: 2.2
    transition: fadeblack
    music: dream
    sfx: [whoosh]

  # ---------------------------------------------------------------- O SONHO
  - id: s03
    day: sonho
    location: rua_sonho_madrugada
    cast: [davi_sonho]
    look: dream
    visual: >-
      Wide cinematic shot: the young man walks with firm purposeful steps down
      the middle of the misty cobblestone street at dawn, toward the camera,
      the retro street lamps glowing amber in the fog behind him, his breath
      a soft cloud, determined and dreamy.
    motion: pull_out
    transition: dissolve
    sfx: [{gen: "Soft dreamy music box melody, gentle and magical, a few notes", line: 0, dur: 5, db: -6}]
    lines:
      - {who: narrador, text: "[dreamy] Na minha cabeça, aquelas madrugadas eram cena de dorama.", pause: 0.25}
      - {who: narrador, text: "[in awe] A névoa cobria a cidade como um véu... e os postes antigos acendiam tudo de dourado.", pause: 0.2}

  - id: s04
    day: sonho
    location: rua_sonho_madrugada
    cast: [davi_sonho]
    look: dream
    visual: >-
      Close-up, three-quarter profile: the young man in his tan suede jacket
      with the collar up, the cold wind gently tousling his styled hair in a
      charming way, soft amber lamplight on his face, a confident hopeful
      half-smile, mist and bokeh behind him.
    motion: push_in
    transition: dissolve
    sfx: [{gen: "Soft cold wind whoosh with a gentle shimmering chime", word: "vento", dur: 3, db: -4}]
    lines:
      - {who: narrador, text: "[warmly] O vento frio bagunçava o meu cabelo... do jeito certo. [playfully] E eu de jaqueta favorita, claro.", pause: 0.25}

  - id: s05
    day: sonho
    location: rua_sonho_madrugada
    cast: [davi_sonho, pai]
    look: dream
    visual: >-
      Medium wide shot beside the gleaming cream and mint-green vintage
      Volkswagen van: the father and his son work side by side in perfect
      harmony, both smiling, lifting neat wooden crates of glossy red tomatoes
      and shiny apples, warm amber lamplight and soft fog, like a classic film.
    motion: pan_right
    transition: dissolve
    sfx: [{gen: "Gentle acoustic guitar strum, warm and nostalgic, short phrase", word: "sintonia", dur: 4, db: -5}]
    lines:
      - {who: narrador, text: "[dreamy] Ao lado de uma Kombi de colecionador, eu e meu pai trabalhávamos em perfeita sintonia.", pause: 0.25}

  - id: s06
    day: sonho
    location: rua_sonho_madrugada
    cast: [davi_sonho]
    look: dream
    visual: >-
      Close-up of the young man's hands (tan suede jacket sleeves) gently
      choosing one perfect glossy red tomato from a wooden crate, holding it
      up to the warm lamplight like a jewel, sparkling dew drops on it, soft
      bokeh.
    motion: push_in
    transition: dissolve
    sfx: [{gen: "A soft harp glissando, romantic and magical", word: "perfeito", dur: 3, db: -4}]
    lines:
      - {who: narrador, text: "[softly] Mãos ágeis, olhar atento. Cada fruta escolhida com carinho... [in awe] cada detalhe, perfeito.", pause: 0.25}

  - id: s07
    day: sonho
    location: rua_sonho_madrugada
    cast: [davi_sonho]
    look: dream
    time: "first golden sunrise light breaking through the fog"
    visual: >-
      Medium shot: early passersby on the charming street at sunrise (a
      young woman with a scarf, an elderly couple) turn their heads and look
      with admiration at the young man carrying a crate of fruit; he gives a
      humble shy smile; golden sunrise glow through the mist, K-drama moment.
    motion: push_in
    transition: dissolve
    sfx: [{gen: "Soft romantic grand piano melody, dreamy and magical, a few notes", line: 0, dur: 6, db: -4}]
    lines:
      - {who: narrador, text: "[playfully] E quem passava parava pra olhar. O rapaz trabalhador, humilde... [chuckles] com poesia guardada no peito.", pause: 0.25}
      - {who: pensamento, text: "[Brazilian accent] [excited] Olha só pra mim: o protagonista perfeito! Só faltava a câmera!", pause: 0.2}

  # ---------------------------------------------------------------- CHOQUE DE REALIDADE
  # card: shock = transicao animada (o sonho congela, racha, estilhaca, chiado,
  # a realidade bate na tela tremendo). Usa a ultima imagem da cena anterior e a
  # primeira da proxima. Sem fala: o som conta a quebra.
  - id: s08
    card: shock
    duration: 1.5
    transition: cut
    music: none
    sfx:
      - {gen: "Vinyl record scratch, music abruptly stopping", at: 0.0, dur: 1.2, db: 2}
      - {gen: "Glass window shattering loudly, shards falling and tinkling", at: 0.3, dur: 2, db: 1}
      - {gen: "Short burst of harsh analog TV static noise", at: 0.8, dur: 0.6, db: -4}
      - {gen: "Deep cinematic sub bass impact boom hit, heavy", at: 1.0, dur: 3, db: 0}

  # ---------------------------------------------------------------- A REALIDADE
  - id: s09
    day: d1
    location: quarto_davi
    cast: [davi]
    look: night
    time: "1 AM, deep night"
    ambience: "Very quiet small bedroom at 1 AM, cold night wind against a small window, crickets, a dog barking very far away, deep silence"
    visual: >-
      Dark tiny bedroom at 1 AM: Davi sits on the edge of his narrow bed,
      half asleep, eyes puffy, pulling his old charcoal-grey zip-up hoodie over
      his white t-shirt, hair messy, the red alarm clock glowing 1:00 on the
      desk beside him, cold blue light from the small window.
    motion: push_in
    transition: cut
    music: night
    sfx: [{gen: "Sleepy heavy sigh and fabric rustle of putting on a hoodie", word: "piedade", dur: 2, db: -6}]
    lines:
      - {who: narrador, text: "[Brazilian accent] [bitterly] Só que a vida real não tinha trilha sonora. [sighs] Nem nada de poético.", pause: 0.3}
      - {who: narrador, text: "[Brazilian accent] [tired] Uma da manhã. O alarme tocava sem nenhuma piedade.", pause: 0.25}

  - id: s10
    day: d1
    location: rua_kombi
    cast: []
    look: night
    time: "2 AM, empty dark city"
    ambience: "Old van engine running on an empty city avenue at night, road noise, light rain on the windshield, wipers squeaking"
    visual: >-
      Wide night shot: the old beat-up white Volkswagen Kombi van with rust
      spots drives alone down an empty wide São Paulo avenue, its yellow
      headlights cutting the cold mist, orange sodium street lights
      reflecting on the wet asphalt, sleeping city around.
    motion: pan_left
    transition: dissolve
    sfx: [{gen: "Old Volkswagen van engine sputtering and starting, then running rough", line: 0, dur: 4, db: -2}]
    lines:
      - {who: narrador, text: "[Brazilian accent] [serious] Eu estava no finalzinho do ensino médio. Sem emprego. E o meu estágio... [chuckles] era ajudar o meu pai, entregador de hortifrúti.", pause: 0.25}
      - {who: narrador, text: "[softly] Enquanto meus colegas dormiam, a gente já estava na estrada... [Brazilian accent] rumo ao entreposto, no centro de São Paulo.", pause: 0.25}

  - id: s11
    day: d1
    location: entreposto
    cast: [davi, pai]
    look: night
    visual: >-
      Medium wide shot in the huge produce market warehouse at night: the
      father pulls and Davi pushes a heavy old wooden hand cart loaded with
      closed crates through an aisle of stacked boxes, both straining,
      breath visible in the cold air, harsh sodium light, wet concrete floor.
    motion: pan_right
    transition: dissolve
    sfx: [{gen: "Heavy old wooden hand cart with creaking squeaky wheels rolling on concrete", word: "rangendo", dur: 4, db: -1}]
    lines:
      - {who: narrador, text: "[Brazilian accent] [tense] Meu pai alugava um carrinho de madeira. Pesado... rangendo a cada metro.", pause: 0.25}
      - {who: narrador, text: "[tired] Duas horas cruzando os galpões, de um lado pro outro, no frio cortante da madrugada.", pause: 0.25}

  - id: s12
    day: d1
    location: entreposto
    cast: [davi]
    look: night
    visual: >-
      Close medium shot: Davi in his grey hoodie lifts a heavy closed wooden
      crate of potatoes onto the stacked cart, face strained, cheeks red from
      the cold, sweat on his forehead, breath steaming, stacked crates and
      blurred warehouse lights behind him.
    motion: push_in
    transition: cut
    sfx: [{gen: "Heavy wooden crate dropped onto a wooden cart, thud", word: "fogo", dur: 1.5, db: -2}]
    lines:
      - {who: pensamento, text: "[Brazilian accent] [frustrated] O nariz congelando de frio... [urgently] e as costas pegando fogo!", pause: 0.3}

  - id: s13
    day: d1
    location: rua_kombi
    cast: [davi, pai]
    look: night
    time: "4 AM, before dawn"
    visual: >-
      Medium shot on the dark wet sidewalk beside the old open Kombi van:
      Davi and his father stand bent over opened wooden crates, sorting by
      hand, tomatoes split into piles of ripe red and still-green, big potatoes
      in one crate and small ones in another, sodium street light, cold mist.
    motion: pan_down
    transition: dissolve
    sfx: [{gen: "Potatoes tumbling and rolling into a wooden crate", word: "batatas", dur: 2, db: -2}]
    lines:
      - {who: narrador, text: "[serious] E o trabalho pesado começava depois. De pé, na calçada, caixa por caixa.", pause: 0.2}
      - {who: narrador, text: "[Brazilian accent] Tomate separado pelo tempo de maturação. As batatas grandes, pra quem fazia fritas... [chuckles] as pequenas, pro outro grupo.", pause: 0.2}

  - id: s14
    day: d1
    location: rua_kombi
    cast: [davi]
    look: night
    time: "4 AM, before dawn"
    visual: >-
      Close-up of Davi's chubby hands with the black digital wristwatch and
      dirty grey hoodie cuffs, carefully sorting red and green tomatoes into
      two wooden crates, dirt under the fingernails, a dented old white van
      door blurred in the background.
    motion: push_in
    transition: cut
    sfx: [{gen: "A single warm determined cello phrase, short", word: "tudo", dur: 3, db: -6}]
    lines:
      - {who: narrador, text: "[proudly] E eu participava de absolutamente tudo.", pause: 0.3}

  - id: s15
    day: d1
    location: centro_sp
    cast: [davi, pai]
    look: real
    time: "8 AM, low morning sun"
    visual: >-
      Medium wide shot on the crowded downtown sidewalk in the morning:
      Davi carries a heavy crate of tomatoes against his chest and his
      father carries a sack of potatoes on his shoulder, dodging hurried
      office workers, toward a small bar with a half-open metal roll-up door,
      morning sun flaring between buildings.
    motion: pan_left
    transition: flash
    music: real
    sfx: [{gen: "Metal roll-up shop door being pulled open with a loud rattle", word: "bar", dur: 2.5, db: -3}]
    lines:
      - {who: narrador, text: "[energetic] Às sete, com o sol raiando, devolvíamos o carrinho... e começava a maratona de entregas.", pause: 0.2}
      - {who: narrador, text: "[Brazilian accent] Bar por bar, restaurante por restaurante... desviando da multidão apressada do centro.", pause: 0.25}

  - id: s16
    day: d1
    location: rua_periferia
    cast: [davi, pai]
    look: real
    time: "noon, harsh overhead sun"
    visual: >-
      Medium shot at noon in the periphery street: the old white Kombi van
      parked in front of a red-brick house, the father closing the van door,
      Davi stepping out exhausted, dirty hoodie tied around his waist, white
      t-shirt stained with dirt and sweat, shoulders dropped, harsh sun.
    motion: push_in
    transition: dissolve
    sfx: [{gen: "Old van sliding door slamming shut, then engine ticking as it cools", word: "toneladas", dur: 3, db: -3}]
    lines:
      - {who: narrador, text: "[tired] Ao meio-dia, a gente voltava pra casa. O corpo pesava toneladas.", pause: 0.25}
      - {who: narrador, text: "[softly] Eu cheirava a terra e a caixote de madeira. [warmly] Cansado... mas com o dever cumprido.", pause: 0.3}

  - id: s17
    day: d1
    location: rua_periferia
    cast: [davi]
    look: real
    time: "noon, hazy hot light"
    ambience: "Quiet periphery rooftop at noon, distant city hum, a kite string whistling in the wind, faint dog bark, a radio playing far away"
    visual: >-
      Davi sits alone on the back bumper of the old Kombi van, elbows on his
      knees, seen in profile, staring with a lost gaze at the horizon of
      endless red-brick houses stacked on the hills of the periphery, a kite
      in the hazy sky, melancholic and thoughtful.
    motion: pull_out
    transition: dissolve
    music: none
    sfx: [{gen: "A single deep dramatic cello note, sad and heavy, cinematic", word: "sempre", dur: 4, db: -3}]
    lines:
      - {who: narrador, text: "[thoughtful] E ali, no meio daquela rotina pesada, eu olhava pro horizonte...", pause: 0.3}
      - {who: pensamento, text: "[Brazilian accent] [sad] Meu Deus... é assim que a minha vida vai ser? [desperate] Pra sempre?", pause: 0.4}

  # ---------------------------------------------------------------- GANCHO
  - id: s18
    day: d1
    location: rua_periferia
    cast: [davi]
    look: real
    time: "early afternoon, hot blazing sun"
    visual: >-
      Davi stands at the gate of his red-brick house in the hot sun with a
      worn backpack on his back, looking down the steep street with a
      determined expression, sweat on his forehead, heat shimmer, an old
      bicycle leaning on the wall beside him.
    motion: push_in
    transition: fadeblack
    sfx: [{gen: "Short hopeful rising string swell, cinematic", word: "sonhos", dur: 3, db: -5}]
    lines:
      - {who: narrador, text: "[determined] Mas eu sabia que não podia parar ali. O hortifrúti sustentava o corpo... não os meus sonhos.", pause: 0.25}
      - {who: narrador, text: "[mysterious] Nos dias de folga, eu colocava a mochila nas costas... e saía pra uma nova maratona.", pause: 0.25}

  - id: s19
    day: d1
    location: rua_periferia
    cast: []
    look: real
    time: "early afternoon, hot blazing sun"
    ambience: "Hot quiet street in the afternoon, cicadas buzzing, a distant motorcycle, wind"
    visual: >-
      Close-up: an old bicycle front basket holding a neat stack of blank
      white sheets of paper (completely blank, no writing visible) held down by
      a small stone, the bicycle wheel and a long hot sunny road behind,
      heat shimmer, dramatic low angle.
    motion: push_in
    transition: cut
    music: night
    sfx:
      - {gen: "Bicycle chain clicking and spokes spinning", line: 0, dur: 3, db: -4}
      - {gen: "Deep cinematic suspense boom hit with long reverb tail", word: "perder?", dur: 4, db: -2}
    lines:
      - {who: narrador, text: "[dramatic] Vinte folhas de papel. Uma bicicleta. E quilômetros de estrada.", pause: 0.3}
      - {who: narrador, text: "[suspenseful] Até onde um sonho pode te levar... [whispers] quando você não tem nada a perder?", pause: 0.45}

  - id: s20
    # PERGUNTA FINAL (regra da serie)
    card: question
    bg: s17
    duration: 3.0
    lead: 0.3
    transition: fadeblack
    lines:
      - {who: narrador, text: "[Brazilian accent] [curious] E você? Encararia essa madrugada com o seu pai... [playfully] ou acha que adolescente devia só estudar? Conta aqui nos comentários.", pause: 0.4}

# ----------------------------------------------------------------------------
# Textos de tela
# ----------------------------------------------------------------------------
cards:
  title:
    kicker: "EPISÓDIO 2"
    title: "O Perfume das Frutas"
    subtitle: "e a Madrugada Gelada"
  question:
    kicker: "E VOCÊ?"
    title: "Encararia essa madrugada?"
    subtitle: "Ou adolescente devia só estudar? Conta nos comentários."
    footer: "Continua no Episódio 3"

# ----------------------------------------------------------------------------
# Publicacao (so sai depois do approve)
# ----------------------------------------------------------------------------
