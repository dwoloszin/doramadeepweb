carousel:
  - type: cover
    bg: s05
    kicker: "CAPÍTULO 3"
    title: "Vinte Folhas de Sulfite e Uma Bicicleta"
    hook: "Cada folha custava mais do que o meu almoço. E eu tinha vinte."

  - bg: s03
    text: |
      Na minha cabeça, eu deslizava pela cidade numa bicicleta vintage impecável.

      A luz da tarde atravessava as folhas das árvores da avenida em feixes dourados. Uma mão no guidão. Na outra, com gestos elegantes, uma pasta de couro.

  - bg: s05
    text: |
      Parava em frente a um prédio de vidro espelhado, descia da bicicleta e ajeitava o colarinho da camisa.

      Olhava lá para o alto com o sorriso de quem sabe que o mundo lhe pertence. O segurança acenava com respeito e abria a porta.

      _Bom dia. Vim entregar o meu futuro._

  - bg: s08
    text: |
      **Só que não tinha prédio de vidro.**

      Tinha o sol cru do meio-dia derretendo o asfalto.

      Naqueles dias de folga do hortifrúti, quando não estava estudando ou descansando o corpo moído, eu tinha outra missão: encontrar um emprego de verdade.

  - bg: s09
    text: |
      Naquela época não existia internet fácil, LinkedIn ou currículo por e-mail. A única bússola eram as páginas amareladas dos classificados.

      E tinha um detalhe cru: imprimir custava caro. Cada folha de sulfite era um investimento para quem não tinha renda.

      _Vinte folhas. Vinte chances._

  - bg: s11
    text: |
      As empresas ficavam longe, a condução era cara demais para o meu bolso vazio. O meu único transporte era a minha bicicleta velha.

      **— Leva água, filho. E volta antes de escurecer, viu? Esse sol hoje tá de rachar.**

  - bg: s12
    text: |
      Suor escorrendo pela testa. A camiseta colada nas costas.

      As mãos firmes no guidão, desviando dos buracos do asfalto quente e dos caminhões. Quilômetros e quilômetros pelas zonas industriais, de olho em cada portão: _Precisa-se. Contrata-se._

  - bg: s15
    text: |
      Em cada portaria, o mesmo ritual: a bicicleta encostada no muro, o fôlego recuperado antes de falar com o porteiro, e a entrega daquela simples folha.

      **— Deixa aí em cima, garoto. Se tiver vaga, eles ligam.**

  - bg: s16
    text: |
      Um currículo com pouca experiência, sem grandes títulos para ostentar, mas carregado de uma esperança gigantesca de ouvir:

      _"Vamos te chamar para uma entrevista."_

  - bg: s17
    text: |
      Minha regra era clara: eu só saía de casa com vinte currículos na mochila, e só voltava quando não restasse nenhum.

      Pedalava até as pernas queimarem, queimado de sol, com a poeira da rua no rosto.

  - bg: s18
    text: |
      Voltava de mãos vazias, mas com o coração disparado a cada toque do telefone fixo da sala.

      **— E aí, filho? Alguém ligou?**

      Ninguém tinha ligado.

  - type: end
    bg: s19
    big: "Uma visita do interior."
    text: |
      Mas naquela tarde, o que estava prestes a cruzar a porta da minha casa não era uma ligação de emprego...

      Era uma visita inesperada que faria o meu coração bater como nunca.
    cta: "CONTINUA NO CAPÍTULO 4 · Salve e siga para não perder"

  - type: question
    bg: s17
    kicker: "E VOCÊ?"
    title: "Já entregou currículo de porta em porta?"
    text: |
      Vinte folhas, uma bicicleta e quilômetros de sol. Sem internet.

      _Você já viveu isso... ou acha que hoje ficou mais fácil?_
    cta: "RESPONDA NOS COMENTÁRIOS"

