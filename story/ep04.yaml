# TEASERS "alerta de spoiler" (divulgacao no meio da semana, antes do episodio sair)
# `python main.py teaser ep04` -> output/ep04/teaser/ (formato em src/teaser.py)
teaser:
  - id: t1
    from: s11
    zoom: 1.0
    focus: [0.55, 0.30]
    badge: "ALERTA DE SPOILER"
    title: "O que será que o Davi **acabou de ver?**"
    footer: "Não perca o próximo episódio!"
    caption: |
      🚨 ALERTA DE SPOILER 🚨

      A caneta parou no ar. O mundo parou junto 😳
      O que será que o Davi acabou de ver?

      Chuta aqui nos comentários 👇
      O próximo episódio chega essa semana. Ative o sininho! 🔔

      📖 Baseado em fatos reais.

      #dorama #kdrama #novela #spoiler #historianarrada
  - id: t2                          # imagem nova, intrigante e sem contar a historia
    shot:
      day: noite
      location: sala_casa
      cast: [davi]
      look: real
      visual: >-
        Medium close shot at night in the small living room: Davi, freshly
        showered in a clean navy t-shirt with neatly combed damp hair, peeks
        nervously through a gap in the floral curtain of the barred window,
        holding his breath, the warm glow of car headlights arriving outside
