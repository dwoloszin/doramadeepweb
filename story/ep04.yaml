# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s09
    kicker: "CAPÍTULO 4"
    title: "O Caos Antes da Chegada e o Impacto dos Olhos Verdes"
    hook: "Tem gente que entra na sua vida e muda o ar da casa inteira."

  - bg: s03
    text: |
      O portão de ferro rangeu. Ao longe, latidos, uma música baixinha na janela de algum vizinho, o som das panelas na cozinha.

      Eu mal tinha jogado a mochila no sofá quando veio o chamado:

      **— Davi! Ainda bem que você chegou! Seus primos do interior vêm passar uns dias aqui! Já tão na estrada! Arruma esse quarto e tira essa bagunça da sala, agora!**

  - bg: s04
    text: |
      Naquela época, descansar depois da escola era um luxo raro. Nem deu tempo de tirar o uniforme.

      _Modo faxina de emergência: ativado._

      Cadernos recolhidos, cobertores dobrados, vassoura na sala.

  - bg: s06
    text: |
      **— Corre no mercadinho da esquina e traz isso aqui antes que eles cheguem!**

      Uma lista rabiscada no papel de pão, umas notas amassadas, e lá fui eu, voando na minha fiel bicicleta sob a luz alaranjada do fim de tarde.

  - bg: s07
    text: |
      De banho tomado, camiseta limpa, cabelo penteado, eu só queria terminar os deveres em paz, sob a luz amarelada da sala.

      Parentes distantes do interior, gente que a gente quase não via. Eu nem imaginava o que estava prestes a atravessar aquela porta.

  - bg: s08
    text: |
      Duas batidinhas na porta. O trinco girando. E, de repente, todo o barulho da casa sumiu.

      Os primos foram entrando com as malas: Joana, Patrícia, Ricardo e Mateus. Mas os meus olhos passaram direto por eles.

  - bg: s09
    text: |
      Cabelos loiros, longos e sedosos, balançando em câmera lenta com o vento da noite. A pele clara. E um par de olhos verdes profundos, brilhantes.

      _Olhos verdes. De novo._

  - bg: s10
    text: |
      O nome dela era **Camila**. Dezessete anos, só um ano mais velha que eu. Parecia uma estrela de cinema que tinha acabado de descer no meio do meu bairro.

  - bg: s11
    text: |
      A caneta congelou a milímetros da folha. O tempo parou na minha sala de estar.

      Meu coração disparou num ritmo que eu nunca tinha sentido antes: susto, encantamento e timidez, tudo junto. As palavras simplesmente sumiram.

  - bg: s14
    text: |
      **— Cumprimenta seus primos, Davi! Não fica aí parado!**

      Orelha pegando fogo. Um aceno desajeitado. Eu era o gordinho tímido que mal conseguia dizer "oi" sem travar, e ela parecia saída de outro mundo, dentro da minha própria casa.

  - bg: s15
    text: |
      No corredor, ao passar pela porta do quarto, ela olhou para mim com um sorriso gentil e curioso.

      **— Oi... você é o Davi, né? A tia fala tanto de você.**

      Eu abaixei o olhar, segurando um sorriso nervoso.

  - type: end
    bg: s16
    big: "Debaixo do mesmo teto."
    text: |
      Eu ainda não sabia, mas os próximos dias seriam os mais emocionantes da minha adolescência.

      O que acontece quando o garoto mais tímido do bairro tem que conviver todo dia com a garota dos olhos verdes?
    cta: "CONTINUA NO CAPÍTULO 5 · Salve e siga para não perder"

  - type: question
    bg: s15
    kicker: "E VOCÊ?"
    title: "Já ficou sem palavras na frente de alguém?"
    text: |
      Um "oi" travado, a orelha pegando fogo, o olhar no chão.

      _Você já passou por isso... ou é do tipo que manda logo um oi?_
    cta: "RESPONDA NOS COMENTÁRIOS"

