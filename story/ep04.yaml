# REGRAS DA SERIE (ver README > Regras de roteiro): pergunta final, som imersivo, transicao nao e fala,
# sonho->real = card: shock, personagem em cena FALA, referencia p/ todo personagem/lugar/objeto,
# elenco consistente (figurante diferente; recorrente sempre no cast).
# ============================================================================
#  EPISODIO 4 — adaptado de scenes/scene4.txt
#
#  PEDIDO DO AUTOR: entra uma passagem AMOROSA (Camila), mas SEM DETALHES —
#  o que acontece entre eles e contado a partir do Ep. 5. Aqui so: o impacto,
#  o coracao disparado, o "oi" travado, um sorriso no corredor.
#
#  Estrutura:
#    0-6s   COLD OPEN: a porta se abre na luz dourada (sem rosto)
#    titulo
#    CORRERIA chega da escola -> MAE: primos do interior! -> faxina relampago -> mercadinho de bike
#    CALMARIA banho, deveres na sala, relogio tique-taque
#    O DORAMA a porta abre, camera lenta, primos... e a CAMILA (olhos verdes de novo!)
#    CHOQUE card: shock (a mae cutuca: "cumprimenta seus primos!")
#    REAL   aceno travado, corredor, o sorriso dela, ele abaixa o olhar
#    GANCHO "o que acontece quando o garoto timido convive todo dia com a garota dos olhos verdes?"
#
#  Continuidade: Davi SEM oculos (foto-modelo), apesar da scene4 citar oculos.
#  Dias: "tarde" (uniforme, chegando da escola) e "noite" (depois do banho).
# ============================================================================

id: ep04
number: 4
title: "O Caos Antes da Chegada e o Impacto dos Olhos Verdes"
source: scenes/scene4.txt

days:
  tarde:
    time: "late weekday afternoon"
    wardrobe:
      davi: escola_uniforme
      mae: casa
  noite:
    time: "early evening at home, warm yellow lamp light"
    wardrobe:
      davi: pos_banho
      mae: casa
      camila: chegada
      primos: chegada

shots:
  # ---------------------------------------------------------------- COLD OPEN
  - id: s01
    day: noite
    location: sala_casa
    cast: []
    look: dream
    visual: >-
      The front door of a small simple living room slowly swings open from
      inside view: a soft warm golden bloom light pours in from outside, and in
      the doorway stands the backlit silhouette of a slim girl with very long
      flowing hair moving in the night breeze, her face hidden in the glow,
      floating light particles, magical and mysterious.
    motion: push_in
    transition: fadeblack
    music: none
    sfx:
      - {gen: "A door latch turning and a door slowly creaking open, quiet room", line: 0, dur: 3, db: -3}
      - {gen: "Soft romantic grand piano melody, dreamy and magical, a few notes", word: "coração", dur: 5, db: -5}
    lines:
      - {who: narrador, text: "[Brazilian accent] [softly] Tem gente que entra na sua vida... e muda o ar da casa inteira.", pause: 0.3}
      - {who: narrador, text: "[Brazilian accent] [whispers] Naquela noite, a porta se abriu... [dramatic] e o meu coração nunca mais bateu do mesmo jeito.", pause: 0.15}

  - id: s02
    card: title
    bg: s11
    duration: 2.2
    transition: fadeblack
    music: real
    sfx: [whoosh]

  # ---------------------------------------------------------------- A CORRERIA
  - id: s03
    day: tarde
    location: sala_casa
    cast: [davi, mae]
    look: real
    time: "late afternoon"
    ambience: "Brazilian periphery house in the late afternoon, dogs barking outside, a neighbor's music playing low, pots clanging in the kitchen"
    visual: >-
      Medium shot in the small living room: Davi, sweaty in his school
      uniform, has just come in and drops his heavy olive-green backpack onto
      the old sofa; his mother rushes in from the kitchen doorway, wiping her
      hands on a dish towel, wide-eyed and in a hurry.
    props: [mochila]
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "Iron house gate creaking open and heavy footsteps on concrete", at: 0.0, dur: 2.5, db: -3}
      - {gen: "Heavy backpack thrown onto an old sofa, thud", word: "chegava", dur: 1.5, db: -3}
    lines:
      - {who: narrador, text: "[tired] Era só mais uma tarde. Eu chegava da escola suado... [sighs] pensando no telefone que não tocava.", pause: 0.2}
      - {who: mae, text: "[Brazilian accent] [urgently] Davi! Ainda bem que você chegou! Seus primos do interior vêm passar uns dias aqui! [excited] Já tão na estrada! Arruma esse quarto e tira essa bagunça da sala, agora!", pause: 0.25}

  - id: s04
    day: tarde
    location: quarto_davi
    cast: [davi]
    look: real
    time: "late afternoon, warm light"
    visual: >-
      Fast-paced close shot: Davi, still in his school uniform, hurriedly folds
      a faded blue blanket on his narrow bed and stacks scattered school
      notebooks, a broom leaning against the wall, motion and urgency.
    motion: pan_right
    transition: cut
    sfx:
      - {gen: "Fast comedic cleaning montage: broom sweeping, blankets flapping, books stacked, quick", line: 0, dur: 5, db: -4}
    lines:
      - {who: narrador, text: "[Brazilian accent] [playfully] Descansar depois da escola? Luxo raro. Nem deu tempo de tirar o uniforme.", pause: 0.15}
      - {who: pensamento, text: "[Brazilian accent] [excited] Atenção, atenção: modo faxina de emergência... ativado!", pause: 0.2}

  - id: s05
    day: tarde
    location: cozinha_casa
    cast: [davi, mae]
    look: real
    time: "late afternoon"
    visual: >-
      Medium shot in the small kitchen: the mother hands Davi a scribbled
      shopping list on a piece of brown bread-bag paper (handwriting
      unreadable) and a few crumpled banknotes, pointing at the door; pots on
      the stove steaming behind her.
    motion: push_in
    transition: cut
    lines:
      - {who: mae, text: "[Brazilian accent] [urgently] Corre no mercadinho da esquina e traz isso aqui antes que eles cheguem! [playfully] Voando, hein!", pause: 0.2}

  - id: s06
    day: tarde
    location: rua_periferia
    cast: [davi]
    props: [bicicleta]
    look: real
    time: "sunset, orange golden light"
    visual: >-
      Wide shot on the steep periphery street at sunset: Davi in his school
      uniform pedals fast on his old rusty dark-red bicycle over the uneven
      asphalt, two plastic grocery bags swinging from the handlebars, orange
      sun flaring between the red-brick houses.
    motion: pan_left
    transition: dissolve
    sfx:
      - {gen: "Bicycle chain spinning fast and plastic grocery bags rustling on handlebars", line: 0, dur: 5, db: -4}
      - {gen: "Small shop door bell chime ringing", word: "mercadinho", dur: 1.5, db: -4}
    lines:
      - {who: narrador, text: "[energetic] Fui e voltei voando do mercadinho. Joguei as sacolas na mesa da cozinha... [laughs] e corri direto pro chuveiro.", pause: 0.25}

  # ---------------------------------------------------------------- A CALMARIA
  - id: s07
    day: noite
    location: sala_casa
    cast: [davi]
    look: real
    time: "night, warm yellow lamp light"
    ambience: "Quiet living room at night, a soft wall clock ticking, a pencil scratching on paper, faint crickets outside"
    visual: >-
      Intimate medium shot: Davi, freshly showered in a clean navy t-shirt with
      neatly combed damp hair, sits at the small living-room table under a warm
      yellow lamp, completely absorbed in his homework, books and notebooks
      open around him, peaceful.
    motion: push_in
    transition: fadeblack
    music: none
    sfx: [{gen: "Shower water turning off, then quiet", at: 0.0, dur: 1.5, db: -6}]
    lines:
      - {who: narrador, text: "[softly] De banho tomado, eu só queria terminar os deveres em paz.", pause: 0.25}
      - {who: narrador, text: "[Brazilian accent] [thoughtful] Parentes distantes do interior, gente que a gente quase não via. [mysterious] Eu nem imaginava o que ia atravessar aquela porta.", pause: 0.3}

  # ---------------------------------------------------------------- O DORAMA
  - id: s08
    day: noite
    location: sala_casa
    cast: [primos, camila]
    look: dream
    visual: >-
      Slow-motion wide shot: the front door is open and a soft golden bloom
      light frames the entrance; the four cousins walk in carrying suitcases
      and backpacks (the 14-year-old with a duffel bag, the 12-year-old, the
      7-year-old girl with braids, the tiny 4-year-old with a teddy bear),
      slightly out of focus; behind them, the blonde girl steps through the
      doorway in sharp focus, glowing.
    motion: pan_right
    transition: dissolve
    music: dream
    sfx:
      - {gen: "Two soft knocks on a wooden door", at: 0.0, dur: 1.5, db: -2}
      - {gen: "Emotional romantic piano and strings theme, K-drama soundtrack, slowly rising", line: 0, dur: 12, db: -5}
    lines:
      - {who: narrador, text: "[dreamy] Duas batidinhas na porta. E de repente... [softly] todo o barulho da casa sumiu.", pause: 0.25}
      - {who: narrador, text: "[in awe] Os primos foram entrando com as malas... mas os meus olhos passaram direto por eles.", pause: 0.2}

  - id: s09
    day: noite
    location: sala_casa
    cast: [camila]
    look: dream
    visual: >-
      Cinematic slow-motion close-up: the night breeze gently lifts her long
      silky blonde hair, warm golden backlight, her fair skin glowing, and a
      pair of deep bright emerald-green eyes looking around the simple living
      room, then opening into a sweet luminous smile. Floating light particles.
    motion: push_in
    transition: dissolve
    sfx: [{gen: "A soft harp glissando, romantic and magical", word: "verdes", dur: 3, db: -3}]
    lines:
      - {who: narrador, text: "[in awe] Cabelos loiros, longos... balançando em câmera lenta. [breathless] E uns olhos verdes...", pause: 0.3}
      - {who: pensamento, text: "[Brazilian accent] [nervous] Não acredito... olhos verdes de novo? [panicking] Por que sempre os olhos verdes?!", pause: 0.2}

  - id: s10
    day: noite
    location: sala_casa
    cast: [camila]
    look: dream
    visual: >-
      Medium close-up: the blonde girl stands in the middle of the simple
      living room smiling softly, the golden bloom making her look like a movie
      star stepping into a humble periphery home, the background soft and
      dreamy.
    motion: pull_out
    transition: dissolve
    lines:
      - {who: narrador, text: "[dreamy] O nome dela era Camila. Dezessete anos, só um ano mais velha que eu... [softly] e parecia uma estrela de cinema que tinha acabado de descer no meio do meu bairro.", pause: 0.25}

  - id: s11
    day: noite
    location: sala_casa
    cast: [davi]
    look: dream
    visual: >-
      Extreme close-up of Davi's face at the living-room table: his pen frozen a
      millimeter above the notebook page, eyes wide open, lips slightly apart,
      holding his breath, a faint blush, golden dreamy light on his face, time
      frozen.
    motion: push_in
    transition: cut
    sfx: [heartbeat]
    lines:
      - {who: narrador, text: "[breathless] O tempo congelou. Meu coração disparou num ritmo que eu nunca tinha sentido.", pause: 0.2}
      - {who: pensamento, text: "[Brazilian accent] [panicking] Fala alguma coisa, Davi... [urgently] qualquer coisa!", pause: 0.2}

  # ---------------------------------------------------------------- CHOQUE DE REALIDADE
  - id: s12
    card: shock
    duration: 1.5
    transition: cut
    music: none
    sfx:
      - {gen: "Vinyl record scratch, music abruptly stopping", at: 0.0, dur: 1.2, db: 2}
      - {gen: "Glass window shattering loudly, shards falling and tinkling", at: 0.3, dur: 2, db: 1}
      - {gen: "Short burst of harsh analog TV static noise", at: 0.8, dur: 0.6, db: -4}
      - {gen: "Deep cinematic sub bass impact boom hit, heavy", at: 1.0, dur: 3, db: 0}

  # ---------------------------------------------------------------- A REALIDADE
  - id: s13
    day: noite
    location: sala_casa
    cast: [davi, mae, primos]
    look: real
    time: "night, normal ceiling light"
    ambience: "Crowded small living room, many people greeting and talking at once, suitcases being dragged, kids laughing, a TV on"
    visual: >-
      Medium shot in the crowded living room with normal flat ceiling light:
      the mother, smiling excitedly at the visitors, pokes Davi's shoulder as
      he sits frozen at the table; the four cousins stand around with
      suitcases, the 12-year-old already looking at the TV.
    motion: pan_right
    transition: cut
    music: real
    lines:
      - {who: mae, text: "[Brazilian accent] [laughing] Cumprimenta seus primos, Davi! Não fica aí parado! [urgently] Vai, mostra o quarto onde eles vão ficar!", pause: 0.2}
      - {who: primos, text: "[Brazilian accent] [excited] E aí, primo! [laughs] Cadê o quarto? A gente tá morto da viagem!", pause: 0.25}

  - id: s14
    day: noite
    location: sala_casa
    cast: [davi]
    look: real
    time: "night, normal ceiling light"
    visual: >-
      Medium close-up: Davi stands up from the chair a bit clumsily, ears
      bright red with embarrassment, giving a small shy wave with one hand,
      eyes deliberately looking away to the side, an awkward nervous smile.
    motion: push_in
    transition: cut
    sfx: [{gen: "Short comedic awkward pluck, two descending notes", word: "oi", dur: 1.5, db: -6}]
    lines:
      - {who: narrador, text: "[Brazilian accent] [chuckles] Orelha pegando fogo. Eu era o gordinho tímido que mal conseguia dizer oi sem travar...", pause: 0.2}
      - {who: narrador, text: "[softly] e ela parecia ter saído de outro mundo. Dentro da minha própria casa.", pause: 0.25}

  - id: s15
    day: noite
    location: quarto_davi
    cast: [davi, camila]
    look: real
    time: "night, warm hallway light"
    visual: >-
      Medium two-shot, ONLY these two people in the frame: at the bedroom
      doorway in the narrow hallway, Davi holds the door open; the blonde girl,
      passing through the door, turns her head and gives him a gentle curious
      smile; Davi quickly lowers his gaze to the floor, holding back a nervous
      smile. Warm soft light, empty room behind them.
    motion: push_in
    transition: dissolve
    music: night
    sfx: [{gen: "Soft romantic suspense: low warm heartbeat-like bass pulse with a gentle rising synth pad", line: 0, dur: 6, db: -6}]
    lines:
      - {who: camila, text: "[Brazilian accent] [softly] Oi... você é o Davi, né? [playfully] A tia fala tanto de você.", pause: 0.3}
      - {who: pensamento, text: "[Brazilian accent] [excited] Ela sabe o meu nome... ela sabe o meu nome! [nervous] Fica calmo, Davi, fica calmo!", pause: 0.25}

  # ---------------------------------------------------------------- GANCHO
  - id: s16
    day: noite
    location: sala_casa
    cast: [davi]
    look: night
    time: "late night, only a small lamp on"
    ambience: "Quiet house late at night, distant laughter of kids in another room, crickets outside, a wall clock ticking"
    visual: >-
      Davi sits alone at the living-room table late at night, the notebook
      still open in front of him, his hand resting on his chest, a secret
      shy smile on his face, staring at the hallway door where soft voices and
      a warm light come from. Intimate, hopeful.
    motion: push_in
    transition: fadeblack
    sfx:
      - {gen: "Deep soft romantic suspense hit with a long warm reverb tail", word: "verdes?", dur: 4, db: -3}
    lines:
      - {who: narrador, text: "[softly] Ter a Camila debaixo do mesmo teto mudou o ar daquela casa. [mysterious] Eu ainda não sabia... mas os próximos dias seriam os mais emocionantes da minha adolescência.", pause: 0.25}
      - {who: narrador, text: "[suspenseful] O que acontece quando o garoto mais tímido do bairro... [whispers] tem que conviver todo dia com a garota dos olhos verdes?", pause: 0.45}

  - id: s17
    card: question
    bg: s15
    duration: 3.0
    lead: 0.3
    transition: fadeblack
    lines:
      - {who: narrador, text: "[Brazilian accent] [curious] E você? Já ficou sem palavras na frente de alguém? [playfully] Ou é do tipo que manda logo um oi? Conta aqui nos comentários.", pause: 0.4}

# ----------------------------------------------------------------------------
cards:
  title:
    kicker: "EPISÓDIO 4"
    title: "O Caos Antes da Chegada"
    subtitle: "e o Impacto dos Olhos Verdes"
  question:
    kicker: "E VOCÊ?"
    title: "Já ficou sem palavras na frente de alguém?"
    subtitle: "Ou é do tipo que manda logo um oi? Conta nos comentários."
    footer: "Continua no Episódio 5"

