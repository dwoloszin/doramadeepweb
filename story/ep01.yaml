# ----------------------------------------------------------------------------
# CARROSSEL — o capitulo escrito (Instagram, 4:5). Cada item = 1 slide.
#   bg: imagem de fundo (id da cena). text: prosa. Use **negrito** e _italico_.
# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s06
    kicker: "CAPÍTULO 1"
    title: "O Garoto do Fundo da Sala e os Olhos Verdes"
    hook: "Eu escrevi 47 cartas de amor. Ela nunca leu nenhuma."

  - bg: s03
    text: |
      Na minha cabeça, era sempre assim.

      A luz da tarde atravessava a janela da sala de aula e fazia a poeira flutuar no ar, devagar, como pétalas de cerejeira em câmera lenta.

  - bg: s04
    text: |
      No fundo da sala, um garoto de uniforme impecável segurava a caneta como quem segura um segredo.

      No verso do caderno de inglês, ele traçava versos apaixonados. Cada palavra escolhida a dedo. Cada rima, trancada a sete chaves.

  - bg: s06
    text: |
      Lá na frente, ela escrevia no quadro. Então se virava, bem devagar.

      Cabelos negros e lisos caindo sobre os ombros. A pele clara. E uns olhos verdes tão intensos que hipnotizavam a sala inteira.

      _Quando ela sorria, eu juro: um piano começava a tocar do nada._

  - bg: s08
    text: |
      Ela caminhava entre as carteiras, e o som do salto ecoava no mesmo ritmo do meu coração.

      Fechei o caderno rápido. A carta, dobrada com cuidado, sumiu lá dentro.

      Ela parou bem ao lado da minha mesa. Debruçou-se um pouco. E disse, com a voz mais aveludada do mundo:

  - bg: s10
    text: |
      **— You're doing a great job, Davi. Ready to read the next sentence for me?**

      O tempo parou. Debaixo da mesa, a carta secreta. A coragem quase vencendo o medo.

      _É agora. Entrega. Só entrega..._

      Mas a voz engasgou.

  - bg: s12
    text: |
      **Mas aí... o sonho se quebrava em mil pedaços.**

      Eu não estava num colégio de elite de Seul. Eu estava no coração da periferia, onde o ronco das motos e o funk estourado na caixa de som da esquina brigavam com a voz da professora.

  - bg: s13
    text: |
      E aquele garoto do uniforme impecável?

      **Era eu.**

      Gordinho. Tímido até o osso. O único da turma que ainda se importava com nota.

  - bg: s14
    text: |
      Os garotos da minha idade tinham tatuagem antes de ter barba. Empinavam moto sem capacete e tinham aquele charme perigoso que enlouquecia as meninas da escola.

      As meninas? Lindas, sim. Mas eu olhava para elas e só via um futuro incerto. Eu não queria afundar naquela realidade.

      **Eu queria sair dela.**

  - bg: s17
    text: |
      Meu refúgio eram as palavras. Poemas. Cartas cheias de sentimento. Todas para ela.

      Nenhuma saiu da minha gaveta. O medo da rejeição e a vergonha do meu próprio corpo me paralisavam.

      _Na vida real, o gordinho tímido da periferia não termina com a garota dos olhos verdes._

  - bg: s18
    text: |
      Naquele dia, cheguei em casa moído. Guardei mais uma carta no fundo da gaveta e deitei, pedindo só umas horas de paz para sonhar.

      Mas o descanso durou pouco.

  - type: end
    bg: s19
    big: "1h da manhã."
    text: |
      O alarme do relógio rasgou o silêncio do quarto.

      O que me esperava do outro lado daquela madrugada gelada?
    cta: "CONTINUA NO CAPÍTULO 2 · Salve e siga para não perder"

  - type: question
    bg: s17
    kicker: "E VOCÊ?"
    title: "Teria entregado as cartas?"
    text: |
      Quarenta e sete cartas. Nenhuma entregue.

      Medo ou prudência? _Você teria coragem... ou faria igual a ele?_
    cta: "RESPONDA NOS COMENTÁRIOS"
