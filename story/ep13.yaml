# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 13"
    title: "A Pergunta dos Dois Ônibus"
    hook: "A minha decisão durou uma eternidade."

  - bg: s05
    text: |
      Entrei naquela sala com o coração na boca.

      **— Carteira em branco, hein? Primeiro emprego?**

      **— Primeiro registrado, sim senhor. Mas eu trabalho desde os dezesseis com o meu pai, nas entregas.**

  - bg: s06
    text: |
      _Olho no olho, como o meu pai mandou. Voz firme... e a perna tremendo debaixo da mesa._

  - bg: s07
    text: |
      **— Você pega quantos ônibus pra chegar até aqui?**

      **— Pego dois.**

      **— Olha... a empresa só pode pagar um transporte. Tudo bem pra você?**

  - bg: s09
    text: |
      Aquele segundo de silêncio pareceu uma eternidade. A minha primeira grande decisão sozinho, como adulto.

      Passou um filme na minha cabeça: as folhas de sulfite de bicicleta, as madrugadas na perua com o meu pai, os meses olhando pro telefone mudo.

  - bg: s13
    text: |
      Eu não tive dúvida nenhuma. Olhei nos olhos dele:

      **— Sim! Tudo bem pra mim.**

  - bg: s15
    text: |
      **— Então seja bem-vindo à equipe, Davi.**

      Carteira assinada: férias, décimo terceiro, fundo de garantia. Coisa que muita empresa na época nem oferecia de cara.

      _A primeira página da minha carteira finalmente tinha uma história._

  - bg: s17
    text: |
      **— Meu filho! Carteira assinada! Eu sabia, eu sabia!**

      **— Esse é o meu garoto. Dois ônibus, é? Pois vai valer cada centavo.**

  - type: end
    bg: s18
    big: "Sem um tostão no bolso."
    text: |
      Aceitar pagar a condução do próprio bolso era só o primeiro obstáculo.

      Como chegar todo dia às onze da noite num aeroporto internacional... sem um tostão no bolso?
    cta: "CONTINUA NO CAPÍTULO 14 · Salve e siga para não perder"

  - type: question
    bg: s14
    kicker: "E VOCÊ?"
    title: "Pagaria a condução do próprio bolso?"
    text: |
      Eu disse sim sem pensar duas vezes.

      _E você: aceitaria? Ou acha que eu errei?_
    cta: "RESPONDA NOS COMENTÁRIOS"

