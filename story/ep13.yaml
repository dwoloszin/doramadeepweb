cards:
  title:
    kicker: "EPISÓDIO 13"
    title: "A Pergunta dos Dois Ônibus"
    subtitle: "e a Primeira Grande Escolha"
  question:
    kicker: "E VOCÊ?"
    title: "Pagaria a condução do próprio bolso?"
    subtitle: "Ou acha que ele errou? Conta nos comentários."
    footer: "Continua no Episódio 14"

