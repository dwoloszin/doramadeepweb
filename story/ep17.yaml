carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 17"
    title: "A Noite das Ordens"
    hook: "Na minha cabeça, o treinamento ia ser assim..."

  - bg: s03
    text: |
      Ela ensinando com paciência, um sorriso aqui, outro ali...

      **— Calma, Davi... com o tempo, você pega o jeito.**

  - bg: s05
    text: |
      Na vida real?

      **— Limpa ali! Pega aquilo! Confere os pedidos!**

      **— Sim, Eva! Já vou, Eva!**

      Eram só ordens. A noite toooda.

  - bg: s06
    text: |
      **— E abastece a torre de refrigerante. Rápido!**

      O refri da máquina é misturado na hora: **uma parte de xarope pra umas cinco de água com gás**.

  - bg: s08
    text: |
      _Pedido montado, bandejinha caprichada..._

      **— Presta atenção, menino! Era pra viagem! Não sabe fazer as coisas direito?!**

      **— Mas... ninguém me falou!**

      **— Tô falando agora.**

      Pra viagem... no aeroporto. Quase todo mundo ali era pra viagem!

  - bg: s09
    text: |
      **— E aí, novato... ainda acha que é o paraíso?**

      **— Paraíso... sei.**

      **— Relaxa, ela é assim com todo novato. O último durou três dias.**

  - bg: s12
    text: |
      Com o sol raiando, eu tava mais cansado do que nos dias de carregar caixa com o meu pai.

      E ainda tinha **vinte quilômetros** de pedal. Mais de uma hora, com as pernas tremendo.

  - bg: s15
    text: |
      Caí na cama. Escola? Que escola...

      A minha mãe viu o meu estado e me deixou dormir.

      **— Davi? Filho, acorda... já são quatro da tarde! Tá tudo bem?**

      **— Tô, mãe... sonhei que tava montando bandeja a noite inteira.**

  - type: end
    bg: s16
    big: "Só a primeira noite."
    text: |
      E aquela era só a primeira noite...

      A cozinha ainda nem tinha mostrado por que ninguém queria ficar lá.
    cta: "CONTINUA NO CAPÍTULO 18 · Salve e siga para não perder"

  - type: question
    bg: s08
    kicker: "E VOCÊ?"
    title: "Já teve um chefe ou colega assim?"
    text: |
      O meu tinha um metro e sessenta... e uma voz de general.

      _E o seu?_
    cta: "RESPONDA NOS COMENTÁRIOS"

