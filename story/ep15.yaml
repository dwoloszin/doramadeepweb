# REGRAS DA SERIE (ver README > Regras de roteiro): ABERTURA MAGICA, pergunta final, som imersivo,
# transicao nao e fala, sonho->real = card: shock (VARIAR o style), personagem em cena FALA,
# referencia p/ todo personagem/lugar/objeto, SEMPRE enriquecer (fatos checados), "baseado em fatos reais".
# ============================================================================
#  EPISODIO 15 — adaptado de scenes/scene15.txt (escrita livre do autor, em 1a pessoa; a noite
#  seguinte ao Ep. 14: o primeiro dia foi "mais pra conhecer" — o tour com o gerente)
#
#  Estrutura:
#    ABERTURA  O DORAMA: o "Gigante de Vidro" — um salao de vidro sobre a pista, avioes como baleias de luz
#    titulo
#    CHOQUE    card: shock style WAKE (o deslumbramento "pisca" — o gerente estala os dedos: "Davi?")
#    O TOUR    a doca de recebimento (logo seria funcao dele) -> o armario e o cadeado
#              -> celular? coisa de adulto com dinheiro (1o celular do Brasil: 1990, no Rio)
#              -> A CHAVE NA MEIA (o segredo que ninguem sabia)
#    O SALAO   8 x 20 m, banheiros (inclusive p/ cadeirante), mesas impecaveis, a PAREDE DE VIDRO
#              -> gente que ia so pra ver avioes (o menino colado no vidro) -> o 747, "Rainha dos Ceus"
#              -> "hoje o restaurante diminuiu: essa vista ficou so na minha memoria"
#    O BALCAO  "o paraiso" (cadeira!) — o Thiago -> o medo do Davi: o CAIXA
#    AS CAMARAS uma resfriada, outra a -18 graus (o gerente brinca)
#    GANCHO    a cozinha: o lugar que ninguem queria no turno da noite... "depois voces vao entender"
#
#  ENRIQUECIMENTO: fatos checados — 1o celular do Brasil ativado em 1990 no Rio de Janeiro; Boeing 747
#  ("Rainha dos Ceus", 1o voo em 1969) tem ~70 m de comprimento; congelados a -18 graus C.
#  Novos: doca_recebimento, salao_loja, balcao_loja (lado de DENTRO do balcao), camara_fria (lugares); menino (so 1 fala, voz Harry).
# ============================================================================

id: ep15
number: 15
title: "O Tour pelo Gigante de Vidro, o Lugar Secreto da Chave e a Pista dos Sonhos"
source: scenes/scene15.txt

voices:
  pensamento:
    eleven: {stability: 0.5}
    tempo: 1.0
    fx: "thought_mid"

days:
  noite:
    time: "night, 11 PM, airport lights"
    wardrobe:
      davi: uniforme_trabalho
      gerente: uniforme
      colega: uniforme_trabalho

shots:
  # ---------------------------------------------------------------- O DORAMA (abertura magica)
  - id: s01
    day: noite
    location: salao_loja
    cast: []
    look: dream
    visual: >-
      Enchanted fairy-tale wide shot at night, NOT a real restaurant: a gigantic
      palace made entirely of glowing crystal glass floats in the air above a
      shining airport runway, its walls transparent and sparkling like ice;
      around it, enormous airplanes made of soft light swim slowly through the
      sky like glowing whales, leaving trails of golden stardust; a sky full of
      stars, blue and gold nebula mist, strong dreamy bloom. Magical, poetic,
      like a K-drama dream. No people.
    motion: push_in
    transition: fadeblack
    music: none
    sfx:
      - {gen: "Magical airy shimmer with a slow majestic orchestral swell and a distant jet passing like a whale song", line: 0, dur: 10, db: -4}
    lines:
      - {who: narrador, text: "[Brazilian accent] [dreamy] Tem lugar que a gente nunca esquece... [softly] o meu era um salão de vidro, com o céu inteiro do lado de fora.", pause: 0.25}

  - id: s02
    card: title
    bg: s01
    duration: 2.2
    transition: fadeblack
    music: dream
    sfx: [whoosh]

  - id: s03
    day: noite
    location: salao_loja
    cast: [davi]
    look: dream
    visual: >-
      Dreamy slow-motion shot at night: Davi in his brand-new red polo and black
      visor stands with one hand touching the giant glass wall, face lit by the
      blue and gold runway lights, mouth slightly open in wonder, as an enormous
      jumbo jet glides past right outside the glass like a ship of light, golden
      sparkles floating around him.
    motion: push_in
    transition: dissolve
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [softly] Na primeira noite, eu achei que tinha entrado dentro de um filme...", pause: 0.3}

  # ---------------------------------------------------------------- CHOQUE (wake: ele "acorda")
  - id: s04
    card: shock
    style: wake                    # ep12 burn, ep13 rewind, ep14 glitch -> variar
    duration: 1.6
    transition: cut
    music: none
    sfx:
      - {gen: "A sharp finger snap close to the ear", at: 0.25, dur: 1.0, db: 0}
      - {gen: "A man's voice calling a name once, firm and friendly, airport background", at: 0.6, dur: 1.2, db: -6}
      - {gen: "Deep soft cinematic boom", at: 1.0, dur: 2.5, db: -4}

  # ---------------------------------------------------------------- O TOUR
  - id: s05
    day: noite
    location: doca_recebimento
    cast: [davi, gerente]
    look: real
    ambience: "Airport service corridor at night, a heavy door buzzing, hand trucks rolling, distant jet engines"
    visual: >-
      Medium two-shot in the airport side service corridor at night: the manager
      with thin black-framed glasses and grey polo, friendly and welcoming, shows
      Davi (red polo, black visor) a hand truck loaded with boxes and crates of
      perishable food next to a heavy metal service door, gesturing like a tour
      guide.
    motion: pan_right
    transition: cut
    music: real
    lines:
      - {who: narrador, text: "[Brazilian accent] [warmly] O primeiro dia foi mais pra conhecer. O gerente, super hospitaleiro, me levou num tour por tudo.", pause: 0.15}
      - {who: gerente, text: "[Brazilian accent] [friendly] É por essa porta que chega a mercadoria, Davi. [playfully] E logo, logo... quem vai carregar tudo isso pras câmaras é você.", pause: 0.2}
      - {who: davi, text: "[Brazilian accent] [eager] Pode deixar, Seu Roberto!", pause: 0.15}

  - id: s06
    day: noite
    location: vestiario
    cast: [davi, gerente]
    look: real
    visual: >-
      Medium two-shot in the staff locker room: the manager with thin black-framed
      glasses opens an empty grey metal locker and points inside; Davi in his red
      polo nods, attentive.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "A metal locker door opening with a squeak", at: 0.2, dur: 1.5, db: -6}
    lines:
      - {who: gerente, text: "[Brazilian accent] [friendly] Esse armário é seu. [calmly] Traz um cadeado amanhã pra guardar as suas coisas, tá?", pause: 0.2}
      - {who: narrador, text: "[Brazilian accent] [laughs softly] Coisas? Celular, naquela época, era coisa de adulto com dinheiro! [playfully] Hoje as crianças já nascem assistindo vídeo no celular...", pause: 0.15}

  - id: s07
    day: noite
    location: vestiario
    cast: []
    look: real
    visual: >-
      Nostalgic close-up: an old chunky early mobile phone with a pull-out
      antenna and a tiny green monochrome screen (no readable text) lying on a
      wooden bench next to a small brass padlock, warm light, like a museum
      piece.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "An old monophonic cell phone ringtone beeping briefly, nostalgic", at: 0.2, dur: 2, db: -10}
    lines:
      - {who: narrador, text: "[curious] Sabia que o primeiro celular do Brasil foi ligado em 1990, no Rio de Janeiro? [amused] Era um tijolão... e custava uma fortuna.", pause: 0.2}

  - id: s08
    day: noite
    location: vestiario
    cast: [davi]
    look: real
    visual: >-
      Comic close-up at the locker room bench: Davi in his red polo, glancing
      around to check nobody is watching, slips a tiny padlock key inside his
      sock, then pushes his foot back into his black work shoe, with a sly
      secret smile.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "Playful sneaky pizzicato, a tiny key jingle", line: 0, dur: 5, db: -8}
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [amused] O meu único bem precioso era a bicicleta... [softly] a mesma das vinte folhas de sulfite. [amused] Então a chave do cadeado ia dentro da meia... e dentro do tênis!", pause: 0.15}
      - {who: narrador, text: "[laughs] Lugar mais seguro não existia. Ninguém sabia dessa história... [playfully] agora vocês sabem!", pause: 0.25}

  # ---------------------------------------------------------------- O SALAO
  - id: s09
    day: noite
    location: salao_loja
    cast: [davi, gerente]
    look: real
    visual: >-
      Very wide establishing shot at night of the huge, spacious restaurant
      hall: a glossy floor shining with reflections, long rows of brand-new
      white tables with red and yellow chairs, walls in white, red and yellow
      with big backlit posters of burger combos, fries and sodas, the
      tray-return station, restroom doors at the back, and the enormous
      floor-to-ceiling glass wall along the whole side showing the lit runway
      and giant airplanes; the manager walks Davi (red polo) through it, both
      small in the frame.
    motion: pull_out
    transition: dissolve
    ambience: "Big restaurant hall inside an airport at night, soft chatter, trays, jets on the runway beyond the glass"
    lines:
      - {who: gerente, text: "[Brazilian accent] [proudly] E esse é o nosso salão, Davi: uma das maiores lojas do aeroporto!", pause: 0.15}
      - {who: davi, text: "[Brazilian accent] [amazed] Dá pra ver a pista inteira daqui!", pause: 0.15}
      - {who: narrador, text: "[warmly] Quase vinte metros de salão, banheiros no fundo, inclusive pra cadeirante... e mesas impecáveis.", pause: 0.2}

  - id: s10
    day: noite
    location: salao_loja
    cast: []
    look: real
    visual: >-
      Medium shot at night at the giant glass wall of the restaurant: a little
      boy of about 7 presses his nose and both hands against the glass, eyes
      huge, pointing at a giant airplane taxiing outside, while a smiling young man who brought him (a stranger)
      kneels beside him; other customers at tables also look out at the runway.
      The airplane is plain white with NO airline name, NO logos, NO text.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "A huge jet engine spooling up on a runway outside a glass wall, muffled", line: 0, dur: 6, db: -8}
    lines:
      - {who: menino, text: "[Brazilian accent] [excited] Pai, pai! Olha o tamanho daquele avião!", pause: 0.15}
      - {who: narrador, text: "[softly] Era a sensação do aeroporto: tinha gente que ia lá sem viajar... [warmly] só pra ver os aviões de pertinho. [softly] E eu, que até pouco tempo atrás só via avião em sonho...", pause: 0.2}

  - id: s11
    day: noite
    location: salao_loja
    cast: []
    look: real
    visual: >-
      Majestic shot through the glass wall at night: a giant four-engine jumbo
      jet with its distinctive hump on the upper deck rolls slowly past, filling
      the window, lights blinking, its reflection on the wet runway. No logos,
      no readable text on the plane.
    motion: pan_right
    transition: dissolve
    lines:
      - {who: narrador, text: "[Brazilian accent] [amazed] O Boeing 747, a Rainha dos Céus, tem uns setenta metros. [playfully] Quase quatro salões daquele, um atrás do outro!", pause: 0.2}

  - id: s12
    day: noite
    location: salao_loja
    cast: []
    look: dream
    time: "first light of dawn, soft melancholic glow"
    visual: >-
      Nostalgic dreamy shot at dawn: the empty restaurant hall with the chairs up
      on the tables and the giant glass wall glowing in the first soft light, the
      runway beyond fading in a gentle mist, warm sepia tones, like a memory
      slowly fading.
    motion: pull_out
    transition: dissolve
    sfx:
      - {gen: "A soft nostalgic piano phrase, bittersweet", line: 0, dur: 8, db: -6}
    lines:
      - {who: narrador, text: "[Brazilian accent] [softly] Ficou com vontade de conhecer? [sadly] Sinto muito... hoje o restaurante diminuiu. Aquela vista ficou só na minha memória.", pause: 0.25}

  # ---------------------------------------------------------------- O BALCAO
  - id: s13
    day: noite
    location: balcao_loja
    cast: [davi, colega]
    look: real
    visual: >-
      Funny medium shot with the camera INSIDE the work area behind the service
      counter, seen from the side: the counter top runs from the foreground
      into the depth on the right, with the customers' hall and a queue of
      customers (casual clothes) BEYOND it on the far side. EXACTLY TWO
      employees in the frame, both on the staff side: (1) THIAGO, the lean,
      tall coworker with medium-brown skin, fade haircut, thin mustache and a
      silver earring, sits NORMALLY on a tall stool at his register, body
      facing the counter, turning only his torso and head toward the camera,
      spreading his arms like a king on a throne, big grin; (2) DAVI, standing
      in the work aisle next to him, exactly as in his reference: chubby with a
      round face, fair skin, no mustache, no earring, black visor, red polo,
      laughing in disbelief. They look clearly DIFFERENT. Behind them the
      pass-through with wrapped burgers under orange heat lamps, order
      tickets on a rail and racks of fresh burger buns. Plain packaging, no
      logos, no other staff.
    motion: push_in
    transition: cut
    music: real
    lines:
      - {who: colega, text: "[Brazilian accent] [laughing] Bem-vindo ao paraíso, novato! [proudly] Aqui no balcão a gente trabalha sentado!", pause: 0.15}
      - {who: davi, text: "[Brazilian accent] [laughs] Sentado?! Achei que tinha errado de emprego!", pause: 0.15}
      - {who: colega, text: "[Brazilian accent] [playfully] É só virar, pegar o lanche ali atrás, montar o pedido e cobrar. [laughs] Moleza!", pause: 0.15}

  - id: s14
    day: noite
    location: balcao_loja
    cast: [davi]
    look: real
    visual: >-
      Tense close-up from the staff side behind the counter: Davi in his red
      polo looks down at an open cash register drawer full of banknotes and
      coins, swallowing hard, a drop of sweat on his temple; behind him, out of
      focus, the heat lamps of the pass-through and stacked burger buns.
    motion: push_in
    transition: cut
    sfx:
      - {gen: "A cash register drawer springing open with a bell, coins rattling, a tense low note", at: 0.0, dur: 3, db: -6}
    lines:
      - {who: pensamento, text: "[Brazilian accent] [deep voice] [tense] Pra mim, era o lugar mais assustador. [firmly] Não pelos clientes... mas pelo caixa: muito dinheiro passando pelas minhas mãos.", pause: 0.2}

  # ---------------------------------------------------------------- AS CAMARAS
  - id: s15
    day: noite
    location: camara_fria
    cast: [davi, gerente]
    look: real
    visual: >-
      Medium two-shot in the brand-new, spotless back area of the kitchen
      (gleaming stainless steel, clean white tiles with red and yellow accent
      stripes, shiny floor): the manager with thin black-framed glasses pulls
      open the heavy glossy white insulated door of a walk-in freezer and a thick wave of icy fog
      pours out over the floor; Davi in his red polo instinctively hugs his own
      arms, eyebrows up; frosted boxes on steel shelves inside.
    motion: push_in
    transition: dissolve
    sfx:
      - {gen: "A heavy insulated freezer door unlatching and opening, icy air hissing, compressor humming", at: 0.0, dur: 4, db: -4}
    lines:
      - {who: gerente, text: "[Brazilian accent] [calmly] Aqui são as câmaras: uma resfriada... e essa, a dezoito graus abaixo de zero. [laughs] Não fica muito tempo aí dentro, hein!", pause: 0.2}

  # ---------------------------------------------------------------- GANCHO
  - id: s16
    day: noite
    location: cozinha_industrial
    cast: [davi, gerente]
    look: real
    visual: >-
      Suspenseful medium shot: the manager with thin black-framed glasses stops
      in front of the gleaming stainless-steel swinging doors of the brand-new,
      spotless industrial kitchen (polished steel, clean white tiles with red
      and yellow accent stripes, shiny red floor) and looks back at Davi with a mysterious half-smile; Davi in his
      red polo stares at the doors; through the round door windows and the gap:
      the long grill steaming, racks of burger buns, the order-ticket rail and
      orange heat lamps glowing.
    motion: push_in
    transition: dissolve
    music: none
    sfx:
      - {gen: "A suspenseful rising string pulse, a grill sizzling behind closed doors", line: 0, dur: 12, db: -5}
    lines:
      - {who: narrador, text: "[Brazilian accent] [mysterious] E por fim... a cozinha. [slowly] O lugar que ninguém queria na escala da noite.", pause: 0.15}
      - {who: narrador, text: "[suspenseful] Logo, logo vocês vão entender por quê.", pause: 0.45}

  - id: s17
    card: question
    bg: s09
    duration: 3.0
    lead: 0.3
    transition: fadeblack
    lines:
      - {who: narrador, text: "[Brazilian accent] [curious] E você? Qual foi o lugar mais marcante do seu primeiro emprego? Conta aqui nos comentários.", pause: 0.4}

