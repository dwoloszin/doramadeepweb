carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 15"
    title: "O Gigante de Vidro"
    hook: "Um salão de vidro, com o céu inteiro do lado de fora."

  - bg: s05
    text: |
      O primeiro dia foi mais pra conhecer. O gerente, super hospitaleiro, me levou num tour por tudo.

      **— É por essa porta que chega a mercadoria, Davi. E logo, logo... quem vai carregar tudo isso pras câmaras é você.**

  - bg: s07
    text: |
      **— Esse armário é seu. Traz um cadeado amanhã pra guardar as suas coisas, tá?**

      Coisas? Celular, naquela época, era coisa de adulto com dinheiro. O primeiro celular do Brasil foi ligado em **1990, no Rio** — um tijolão que custava uma fortuna.

  - bg: s08
    text: |
      _O meu único bem precioso era a bicicleta. Então a chave do cadeado ia dentro da meia... e dentro do tênis!_

      Lugar mais seguro não existia. Ninguém sabia dessa história. Agora vocês sabem.

  - bg: s09
    text: |
      E então, o salão. Enorme: uns **8 metros** de largura por quase **20** de comprimento. Banheiros no fundo, inclusive pra cadeirante, e mesas impecáveis.

      E na lateral inteira, uma **parede de vidro** com a pista e os aviões gigantes.

  - bg: s10
    text: |
      **— Pai, pai! Olha o tamanho daquele avião!**

      Era a sensação do aeroporto: tinha gente que ia lá sem viajar, só pra ver os aviões de pertinho.

      O **Boeing 747**, a "Rainha dos Céus", tem uns **70 metros** — quase quatro salões daquele.

  - bg: s12
    text: |
      Ficou com vontade de conhecer?

      Sinto muito. Hoje o restaurante diminuiu. Aquela vista ficou só na minha memória.

  - bg: s13
    text: |
      **— Bem-vindo ao paraíso, novato! Aqui no balcão a gente trabalha sentado!**

      _Pra mim, era o lugar mais assustador. Não pelos clientes... mas pelo caixa: muito dinheiro passando pelas minhas mãos._

  - bg: s15
    text: |
      **— Aqui são as câmaras: uma resfriada... e essa, a dezoito graus abaixo de zero. Não fica muito tempo aí dentro, hein!**

  - type: end
    bg: s16
    big: "A cozinha."
    text: |
      E por fim... a cozinha. O lugar que ninguém queria na escala da noite.

      Logo, logo vocês vão entender por quê.
    cta: "CONTINUA NO CAPÍTULO 16 · Salve e siga para não perder"

  - type: question
    bg: s09
    kicker: "E VOCÊ?"
    title: "Qual lugar marcou o seu primeiro emprego?"
    text: |
      Pra mim, foi um salão de vidro com a pista inteira do lado de fora.

      _E pra você?_
    cta: "RESPONDA NOS COMENTÁRIOS"

