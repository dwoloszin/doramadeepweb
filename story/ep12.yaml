# ----------------------------------------------------------------------------
carousel:
  - type: cover
    bg: s01
    kicker: "CAPÍTULO 12"
    title: "A Carteira em Branco"
    hook: "Na minha cabeça, o primeiro emprego ia ser em câmera lenta."

  - bg: s03
    text: |
      No sonho, eu atravessava um terminal de vidro e aço com um terno sob medida. Executivos do mundo inteiro me olhavam com respeito.

      **— Estávamos esperando por você.**

      _Olhar calmo, magnético... pronto pra assumir um império internacional._

  - bg: s06
    text: |
      Na vida real, foram meses de silêncio. Até que o telefone da sala tocou.

      **— Você pode vir fazer uma entrevista amanhã de manhã? E traga a sua carteira de trabalho em mãos, tá?**

      **— Posso! Claro que posso!**

  - bg: s08
    text: |
      Fui direto ao fundo da gaveta. A carteira estava limpinha, sem uma dobra... e absolutamente em branco.

      **— Novinha em folha, hein, filho? Nem um carimbo!**

  - bg: s09
    text: |
      A carteira de trabalho existe no Brasil desde **1932**. Em **1943** veio a **CLT**: férias, salário em dia, os direitos no papel.

      Na periferia, carteira assinada era quase um troféu.

  - bg: s11
    text: |
      A noite foi péssima: eu ensaiava cada resposta pro teto.

      Mas de manhã, o ritual foi de gala: banho caprichado, a melhor roupa, perfume e cabelo alinhado no gel.

  - bg: s12
    text: |
      **— Olha só! Tá cheiroso, hein? Parece até artista de novela!**

      **— Vai com Deus, filho. E olha nos olhos do homem, hein!**

  - bg: s14
    text: |
      Dois ônibus até o endereço: **Aeroporto Internacional de Guarulhos**.

      O povo chama de **Cumbica**, por causa do bairro. É o aeroporto mais movimentado da América do Sul. Pra um garoto da periferia, soava chique e distante demais.

  - bg: s15
    text: |
      A empresa tinha um nome imponente: **Arcos Dourados**. Não reconheceu? O nome popular é outro... **McDonald's**!

      A Arcos Dourados é a maior franqueada do McDonald's no mundo. E o primeiro do Brasil abriu em **1979, em Copacabana**.

  - type: end
    bg: s18
    big: "— Próximo!"
    text: |
      Na sala de espera, uma fila de jovens iguais a mim. Suor frio na nuca, a carteira em branco apertada no joelho.

      Cada vez que aquela porta abria, meu coração ia junto. E agora... era a minha vez.
    cta: "CONTINUA NO CAPÍTULO 13 · Salve e siga para não perder"

  - type: question
    bg: s18
    kicker: "E VOCÊ?"
    title: "Lembra da sua primeira entrevista?"
    text: |
      A minha começou com uma carteira em branco e dois ônibus.

      _E a sua: como foi?_
